<title>TOMI Ride Rediseño</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link id="tr-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Nunito+Sans:opsz,wght@6..12,400..800&family=DM+Mono:wght@400;500&display=swap">
<style id="tr-css">
/* Layout: una "ruta de crecimiento" de 12 meses a 8 años organiza el sitio; los colores y letras vienen del panel (variables abajo son los valores por defecto). */
:root{
  --paper:#F3F7F5; --surface:#FFFFFF; --ink:#13201C; --muted:#56655F; --line:#D5E0DB;
  --mint:#7FD9C3; --mint-ink:#11745F; --mint-soft:#DDF4EC; --on-mint:#0B2A22; --sale:#C2324F;
  --f-display:"Archivo","Arial Narrow",Impact,sans-serif; --dw:900; --dstretch:68%; --upper:uppercase; --ts:1;
  --f-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:18px; --wrap:1180px;
  --shadow:0 1px 0 rgba(19,32,28,.04),0 12px 32px -18px rgba(19,32,28,.28);
  --wa:#25D366; --wa-ink:#06331A;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
#site{container:site/inline-size;background:var(--paper);color:var(--ink);min-height:100vh}
#site img{display:block;max-width:100%}
:where(#site) a{color:inherit}
#site :focus-visible{outline:3px solid var(--mint-ink);outline-offset:3px;border-radius:6px}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#site h1,#site h2,#site h3{font-family:var(--f-display);font-stretch:var(--dstretch);font-weight:var(--dw);line-height:.95;letter-spacing:-.01em;text-wrap:balance;margin:0;text-transform:var(--upper)}
#site h2{font-size:calc(clamp(2.1rem,5.4cqi,3.8rem)*var(--ts))}
#site h3{font-size:calc(1.5rem*var(--ts))}
#site p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mint-ink);font-weight:500}
.lede{color:var(--muted);font-size:1.08rem;max-width:58ch}
.sec{padding-block:clamp(48px,8cqi,96px)}
.sec-head{display:grid;gap:14px;margin-bottom:36px}
.ph-empty{display:grid;place-items:center;background:var(--mint-soft);color:var(--mint-ink);font:500 .8rem var(--f-mono);width:100%;height:100%;min-height:80px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;font:800 .95rem/1.1 var(--f-body);text-decoration:none;border:2px solid transparent;cursor:pointer;transition:transform .15s;text-align:center}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--ink);color:var(--paper)}
.btn-mint{background:var(--mint);color:var(--on-mint)}
.btn-ghost{border-color:var(--ink);color:var(--ink);background:transparent}
.btn-wa{background:var(--wa);color:var(--wa-ink)}
.btn svg{width:18px;height:18px;flex:none}

.strip{background:var(--ink);color:var(--paper);font-size:.85rem;font-weight:700}
.strip .wrap{display:flex;gap:8px 28px;justify-content:center;padding-block:9px;flex-wrap:wrap;text-align:center}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:20px;min-height:68px;position:relative}
.logo{display:block;border-radius:8px;padding:6px 10px;flex:none;text-decoration:none}
.logo img{height:26px;width:auto}
nav.main{display:flex;gap:2px;flex-wrap:wrap}
nav.main a{text-decoration:none;font-weight:700;font-size:.95rem;padding:8px 12px;border-radius:999px}
nav.main a:hover{background:var(--mint-soft)}
.top .spacer{flex:1}
.menu-btn{display:none;background:none;border:2px solid var(--ink);border-radius:999px;color:var(--ink);font:800 .9rem var(--f-body);padding:8px 14px;cursor:pointer}
@container site (max-width:900px){
  nav.main{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 16px 16px}
  nav.main.open{display:flex}
  nav.main a{padding:14px 12px;font-size:1.05rem}
  .menu-btn{display:inline-flex}
  .top .btn-primary{display:none}
}

.hero{padding-block:clamp(28px,5cqi,64px) clamp(40px,6cqi,72px)}
.hero .wrap{display:grid;grid-template-columns:1.02fr 1fr;gap:clamp(24px,5cqi,64px);align-items:center}
#site .hero h1{font-size:calc(clamp(2.7rem,7cqi,5.4rem)*var(--ts));line-height:.88}
.hero h1 em{font-style:normal;color:var(--mint-ink)}
.hero-copy{display:grid;gap:22px;min-width:0}
.hero-ctas{display:flex;gap:12px;flex-wrap:wrap}
.hero-facts{display:flex;gap:10px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.hero-facts li{font-family:var(--f-mono);font-size:.8rem;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px}
.hero-photo{position:relative;min-width:0}
.hero-photo img,.hero-photo .ph-empty{width:100%;height:auto;aspect-ratio:4/3.4;object-fit:cover;border-radius:calc(var(--r) + 10px)}
.tag{position:absolute;background:var(--surface);color:var(--ink);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);font-size:.85rem;line-height:1.3;display:grid;gap:2px;text-decoration:none}
.tag b{font-family:var(--f-display);font-stretch:var(--dstretch);font-size:1.1rem;text-transform:var(--upper)}
.tag .mono{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.tag-a{left:-14px;bottom:16%}
.tag-b{right:14px;top:14px;background:var(--mint);color:var(--on-mint)}
.tag-b .mono{color:var(--on-mint);opacity:.75}
@container site (max-width:820px){.hero .wrap{grid-template-columns:1fr}.tag-a{left:12px;bottom:12px}}

.route{background:var(--surface);border-block:1px solid var(--line)}
.route .wrap{padding-block:26px}
.ruler{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.stage{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center;text-decoration:none;padding:10px;border-radius:16px}
.stage:hover{background:var(--mint-soft)}
.stage img,.stage .ph-empty{width:72px;height:72px;object-fit:contain;background:#fff;border-radius:12px;min-height:0}
.stage .age{font-family:var(--f-mono);font-size:.78rem;color:var(--mint-ink)}
.stage .nm{font-family:var(--f-display);font-stretch:var(--dstretch);font-weight:var(--dw);font-size:1.2rem;text-transform:var(--upper);line-height:1}
.scale{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.72rem;color:var(--muted);border-top:2px solid var(--ink);margin-top:18px;padding-top:6px}
.scale span{position:relative}
.scale span::before{content:"";position:absolute;left:50%;top:-12px;width:2px;height:8px;background:var(--ink)}
@container site (max-width:480px){.scale{display:none}}

.finder{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(24px,4cqi,48px);background:var(--ink);color:var(--paper);border-radius:calc(var(--r) + 14px);padding:clamp(22px,4cqi,48px)}
.finder .eyebrow{color:var(--mint)}
#site .finder h2{color:var(--paper)}
.finder .lede{color:color-mix(in srgb,var(--paper) 72%,transparent);margin-top:14px}
.ctrl{display:grid;gap:10px;margin-top:24px}
.ctrl label{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.ctrl output{font-family:var(--f-display);font-stretch:var(--dstretch);font-weight:var(--dw);font-size:2.3rem;line-height:1;color:var(--mint)}
.ctrl input[type=range]{width:100%;accent-color:var(--mint);height:28px}
.ticks{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.7rem;opacity:.6}
.results{display:grid;gap:12px;align-content:start}
.res{display:grid;grid-template-columns:84px 1fr auto;gap:14px;align-items:center;background:color-mix(in srgb,var(--paper) 8%,transparent);border:1px solid color-mix(in srgb,var(--paper) 14%,transparent);border-radius:18px;padding:10px 14px 10px 10px;text-decoration:none;color:inherit}
.res img,.res .ph-empty{width:84px;height:84px;object-fit:contain;background:#fff;border-radius:12px;min-height:0}
.res .nm{font-weight:800;font-size:1.05rem;line-height:1.2}
.res .meta{font-size:.85rem;opacity:.75}
.res .fit{font-family:var(--f-mono);font-size:.72rem;padding:5px 10px;border-radius:999px;white-space:nowrap}
.fit-ideal{background:var(--mint);color:var(--on-mint)}
.fit-ok{background:color-mix(in srgb,var(--paper) 18%,transparent)}
.fit-no{border:1px dashed color-mix(in srgb,var(--paper) 35%,transparent)}
.res.off{opacity:.4}
@container site (max-width:820px){.finder{grid-template-columns:1fr}}
@container site (max-width:440px){.res{grid-template-columns:64px 1fr}.res img,.res .ph-empty{width:64px;height:64px}.res .fit{grid-column:2;justify-self:start}}

.grid-products{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.card .ph{position:relative;background:#fff;aspect-ratio:1/1}
.card .ph img{width:100%;height:100%;object-fit:contain;padding:16px}
.off-badge{position:absolute;left:12px;top:12px;background:var(--sale);color:#fff;font:800 .8rem var(--f-body);padding:5px 10px;border-radius:999px;z-index:1}
.age-badge{position:absolute;right:12px;top:12px;background:var(--ink);color:var(--paper);font:500 .72rem var(--f-mono);padding:5px 9px;border-radius:999px;z-index:1}
.card .bd{padding:16px 18px 18px;display:grid;gap:12px;flex:1;align-content:start}
.card .sub{color:var(--muted);font-size:.9rem;line-height:1.4}
.swatches{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.swatches .lbl{font-size:.82rem;color:var(--muted);margin-left:4px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.price .now{font-family:var(--f-display);font-stretch:var(--dstretch);font-weight:var(--dw);font-size:1.9rem;line-height:1}
.price .was{color:var(--muted);text-decoration:line-through;font-size:.92rem}
.price .cur{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.card .acts{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:auto}
.card .acts .btn{min-height:44px;padding:0 16px;font-size:.88rem}

.pdp{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(24px,5cqi,64px);align-items:start}
.pdp.rev .gal{order:2}
@container site (max-width:900px){.pdp{grid-template-columns:1fr}.pdp.rev .gal{order:0}}
.gal{display:grid;gap:10px}
.gal .main{border-radius:calc(var(--r) + 6px);overflow:hidden;background:#fff;aspect-ratio:1/1}
.gal .main img{width:100%;height:100%;object-fit:cover}
.gal .main img.contain{object-fit:contain;padding:8%}
.thumbs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.thumbs button{padding:0;border:2px solid transparent;border-radius:12px;overflow:hidden;cursor:pointer;background:#fff;aspect-ratio:1/1}
.thumbs button[aria-current="true"]{border-color:var(--ink)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.info{display:grid;gap:20px;min-width:0}
#site .info h2{font-size:calc(clamp(2.3rem,5.4cqi,4.2rem)*var(--ts))}
.spec{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.spec .hd{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:var(--ink);color:var(--paper)}
.spec .hd b{font-family:var(--f-display);font-stretch:var(--dstretch);text-transform:var(--upper);font-size:1.05rem}
.spec .hd span{font-family:var(--f-mono);font-size:.72rem;opacity:.75}
.spec dl{margin:0;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}
.spec dt,.spec dd{margin:0;padding:11px 18px;border-top:1px solid var(--line);font-size:.92rem}
.spec dt{color:var(--muted)}
.spec dd{font-family:var(--f-mono);font-size:.86rem;font-variant-numeric:tabular-nums}
.spec dl>:nth-child(-n+2){border-top:0}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.checks li{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start}
.checks li::before{content:"✓";display:grid;place-items:center;width:22px;height:22px;margin-top:2px;border-radius:50%;background:var(--mint);color:var(--on-mint);font-weight:900;font-size:.8rem}
.buyrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

.why{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.why figure{margin:0;border-radius:calc(var(--r) + 4px);overflow:hidden;min-height:200px}
.why figure img{width:100%;height:100%;object-fit:cover}
.why .a{grid-column:span 5;grid-row:span 2}
.why .b{grid-column:span 4}
.why .c{grid-column:span 3}
.why .d{grid-column:span 7;background:var(--mint);color:var(--on-mint);border-radius:calc(var(--r) + 4px);padding:clamp(20px,3cqi,32px);display:grid;gap:16px;align-content:center}
.why .d .eyebrow{color:var(--on-mint)}
#site .why .d h3{font-size:calc(clamp(1.8rem,3.4cqi,2.6rem)*var(--ts))}
.why .d ul{margin:0;padding-left:1.1em;display:grid;gap:6px}
@container site (max-width:900px){.why .a,.why .b,.why .c,.why .d{grid-column:span 12;grid-row:auto}.why .a{aspect-ratio:4/3}}

.cmp-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.cmp{border-collapse:collapse;width:100%;min-width:640px;font-size:.92rem}
.cmp th,.cmp td{padding:14px 16px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.cmp thead th{font-family:var(--f-display);font-stretch:var(--dstretch);font-weight:var(--dw);text-transform:var(--upper);font-size:1.1rem;line-height:1.05}
.cmp thead th img{width:72px;height:72px;object-fit:contain;background:#fff;border-radius:10px;margin-bottom:8px}
.cmp tbody th{color:var(--muted);font-weight:600;width:18%}
.cmp td{font-family:var(--f-mono);font-size:.84rem;font-variant-numeric:tabular-nums}
.cmp tr:last-child>*{border-bottom:0}

.community{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:220px;gap:12px}
.community figure{margin:0;border-radius:calc(var(--r) + 2px);overflow:hidden;position:relative}
.community img{width:100%;height:100%;object-fit:cover}
.community figure:first-child{grid-column:span 2;grid-row:span 2}
.community figcaption{position:absolute;left:12px;bottom:12px;background:var(--surface);color:var(--ink);font-size:.8rem;font-weight:700;padding:6px 12px;border-radius:999px}
@container site (max-width:820px){.community{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:170px}}

.faq{display:grid;gap:10px;max-width:820px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 20px}
.faq summary{cursor:pointer;list-style:none;font-weight:800;font-size:1.05rem;padding:18px 0;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-family:var(--f-mono);font-size:1.3rem;line-height:1;color:var(--mint-ink)}
.faq details[open] summary::after{content:"–"}
.faq details p{padding-bottom:18px;color:var(--muted);max-width:65ch}

footer.ft{background:var(--ink);color:var(--paper);padding-block:56px 96px;margin-top:clamp(40px,6cqi,72px)}
footer.ft .cols{display:grid;grid-template-columns:1.4fr repeat(3,minmax(0,1fr));gap:32px}
footer.ft h4{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;font-weight:500;opacity:.6;margin:0 0 12px}
footer.ft ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
footer.ft a{text-decoration:none;opacity:.9}
footer.ft a:hover{opacity:1;text-decoration:underline}
footer.ft .claim{font-family:var(--f-display);font-stretch:var(--dstretch);font-weight:var(--dw);font-size:calc(clamp(1.9rem,4cqi,3rem)*var(--ts));text-transform:var(--upper);line-height:.95;margin-top:18px;color:var(--mint)}
footer.ft .legal{margin-top:40px;padding-top:20px;border-top:1px solid color-mix(in srgb,var(--paper) 18%,transparent);font-size:.8rem;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer.ft .legal span{opacity:.6}
@container site (max-width:820px){footer.ft .cols{grid-template-columns:1fr 1fr}}
@container site (max-width:460px){footer.ft .cols{grid-template-columns:1fr}}

.wa-float{position:fixed;right:calc(env(safe-area-inset-right,0px) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:55;display:flex;align-items:center;gap:10px;background:var(--wa);color:var(--wa-ink);text-decoration:none;border-radius:999px;padding:12px;box-shadow:0 10px 30px -8px rgba(6,51,26,.55);font:800 .92rem var(--f-body)}
.wa-float svg{width:30px;height:30px;flex:none}
.wa-float span{padding-right:8px}
.wa-float:hover{transform:translateY(-2px)}
@media (max-width:560px){.wa-float span{display:none}}

/* ===== Panel de administración ===== */
.adm,.adm-login,.adm-toast,.adm-return{--a-bg:#FFFFFF;--a-soft:#F2F4F3;--a-line:#E1E6E3;--a-ink:#1B2420;--a-muted:#66716C;--a-blue:#2563EB;--a-blue-soft:#E8EFFE;--a-ok:#15803D;--a-warn:#B45309;--a-red:#C2324F;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--a-ink)}
html.is-admin{--admw:400px}
html.is-admin body{padding-left:var(--admw)}
html.is-admin.adm-hidden body{padding-left:0}
html.is-admin .wa-float{right:calc(env(safe-area-inset-right,0px) + 18px)}
html.is-admin #site [data-edit]{cursor:pointer;outline:2px dashed transparent;outline-offset:4px;transition:outline-color .15s}
html.is-admin #site [data-edit]:hover{outline-color:#2563EB}
html.is-admin.adm-hidden #site [data-edit]:hover{outline-color:transparent}
html.dev-phone body{background:#DDE3E0}
html.dev-phone #site{max-width:390px;margin:24px auto;border-radius:28px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(0,0,0,.45);min-height:0}
html.dev-phone #site header.top{top:0}
.adm{position:fixed;left:0;top:0;bottom:0;width:var(--admw);z-index:90;background:var(--a-bg);border-right:1px solid var(--a-line);display:grid;grid-template-rows:auto 1fr auto;box-shadow:8px 0 30px -20px rgba(0,0,0,.3);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.adm[hidden]{display:none}
.adm-top{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--a-line)}
.adm-top .ttl{font-weight:800;font-size:1rem;flex:1}
.adm-seg{display:inline-flex;background:var(--a-soft);border-radius:10px;padding:3px}
.adm-seg button{border:0;background:none;padding:6px 9px;border-radius:8px;cursor:pointer;color:var(--a-muted);display:grid;place-items:center}
.adm-seg button[aria-pressed="true"]{background:#fff;color:var(--a-ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.adm-seg svg{width:18px;height:18px}
.adm-ic{border:0;background:var(--a-soft);color:var(--a-ink);border-radius:10px;padding:8px 10px;cursor:pointer;font:600 .82rem inherit;display:inline-flex;align-items:center;gap:6px}
.adm-ic:hover{background:var(--a-line)}
.adm-ic svg{width:16px;height:16px}
.adm-body{overflow-y:auto;padding:18px 16px 28px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-content:start}
.adm-body *{min-width:0}
.adm-foot{border-top:1px solid var(--a-line);padding:12px 14px;display:grid;gap:10px;background:var(--a-bg)}
.adm-status{font-size:.82rem;color:var(--a-muted);display:flex;align-items:center;gap:8px}

.adm-actions{display:grid;grid-template-columns:auto 1fr;gap:8px}
.a-btn{border:0;border-radius:12px;padding:12px 16px;font:700 .95rem inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.a-btn:disabled{opacity:.45;cursor:default}
.a-primary{background:var(--a-blue);color:#fff}

.a-danger{background:#FCE8EC;color:var(--a-red)}

.adm h2.v{font-size:1.35rem;font-weight:800;margin:0;letter-spacing:-.01em}
.adm .vsub{color:var(--a-muted);font-size:.9rem;margin:-8px 0 0}
.adm .back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--a-muted);font:600 .88rem inherit;cursor:pointer;padding:0;justify-self:start}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{border:1px solid var(--a-line);background:#fff;border-radius:16px;padding:14px;text-align:left;cursor:pointer;display:grid;gap:8px;font:inherit;color:inherit;transition:border-color .15s,transform .15s}

.tile b{font-size:1rem}
.tile small{color:var(--a-muted);font-size:.8rem;line-height:1.35}
.tile .dots{display:flex;gap:4px}
.tile .dots i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.1)}
.tip{background:var(--a-blue-soft);border-radius:14px;padding:12px 14px;font-size:.88rem;line-height:1.45;color:#1E3A8A}
.warnbox{background:#FEF3E2;border-radius:14px;padding:12px 14px;font-size:.88rem;line-height:1.45;color:#7C3A06;display:grid;gap:8px}
.warnbox .row{display:flex;gap:8px;flex-wrap:wrap}
.grp{border:1px solid var(--a-line);border-radius:16px;background:#fff;overflow:hidden}
.grp>summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--a-muted);border-bottom:2px solid var(--a-muted);transform:rotate(45deg);margin-top:-4px;transition:transform .2s}
.grp[open]>summary::after{transform:rotate(-135deg);margin-top:4px}
.grp>summary small{color:var(--a-muted);font-weight:500;font-size:.8rem;margin-left:auto}
.grp .in{padding:4px 16px 16px;display:grid;gap:14px}
.box{border:1px solid var(--a-line);border-radius:16px;background:#fff;padding:16px;display:grid;gap:14px}
.box>h3{margin:0;font-size:.95rem;font-weight:800}
.fld{display:grid;gap:6px}
.fld>label,.fld>.lb{font-size:.84rem;font-weight:700}
.fld .hint{font-size:.78rem;color:var(--a-muted);line-height:1.35}
.adm input[type=text],.adm input[type=url],.adm input[type=tel],.adm input[type=email],.adm textarea,.adm-login input{width:100%;border:1.5px solid var(--a-line);border-radius:10px;padding:10px 12px;font:500 .95rem inherit;color:var(--a-ink);background:#fff}
.fld textarea{min-height:84px;resize:vertical;line-height:1.45}

.fld.flash input,.fld.flash textarea{animation:flash 1.2s}
@keyframes flash{0%,40%{border-color:var(--a-blue);box-shadow:0 0 0 4px #BFD3FD}100%{}}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw-row{display:flex;align-items:center;gap:10px}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:.9rem;font-weight:600;cursor:pointer}
.tgl input{appearance:none;width:44px;height:26px;border-radius:999px;background:#CBD3CF;position:relative;cursor:pointer;flex:none;transition:background .15s}
.tgl input::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.tgl input:checked{background:var(--a-blue)}
.tgl input:checked::after{left:21px}
.lst{display:grid;gap:8px}
.lst .it{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:start}
.x{border:0;background:var(--a-soft);color:var(--a-muted);width:36px;height:40px;border-radius:10px;cursor:pointer;font-size:1.1rem;line-height:1}
.x:hover{background:#FCE8EC;color:var(--a-red)}
.add{border:1.5px dashed #B9C4BF;background:none;border-radius:12px;padding:10px;font:700 .88rem inherit;color:var(--a-blue);cursor:pointer}
.add:hover{border-color:var(--a-blue);background:var(--a-blue-soft)}
.pair{border:1px solid var(--a-line);border-radius:12px;padding:10px;display:grid;gap:8px;background:var(--a-soft)}
.pair .top{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;font-weight:700;color:var(--a-muted)}
.img-slot{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.img-slot .th{width:96px;height:96px;border-radius:12px;background:var(--a-soft) center/cover no-repeat;border:1.5px dashed transparent;display:grid;place-items:center;color:var(--a-muted);font-size:.75rem;overflow:hidden;cursor:pointer}
.img-slot .th img{width:100%;height:100%;object-fit:cover}
.img-slot .th.drag{border-color:var(--a-blue);background-color:var(--a-blue-soft)}
.img-slot .ops{display:grid;gap:6px;justify-items:start}
.img-grid{display:grid;grid-template-columns:1fr;gap:12px}
input[type=color]{width:44px;height:40px;border:1.5px solid var(--a-line);border-radius:10px;padding:2px;background:#fff;cursor:pointer;flex:none}
input[type=range].a-range{width:100%;accent-color:var(--a-blue)}
.prow{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center;border:1px solid var(--a-line);border-radius:14px;padding:8px 10px 8px 8px;background:#fff}
.prow img,.prow .noimg{width:52px;height:52px;border-radius:10px;object-fit:contain;background:var(--a-soft)}
.prow b{display:block;font-size:.92rem;line-height:1.25}
.prow small{color:var(--a-muted);font-size:.8rem}
.prow .ops{display:flex;gap:6px;grid-column:1/-1;flex-wrap:wrap}
.prow .ops .blue{flex:1}
.mini{border:0;background:var(--a-soft);border-radius:9px;min-width:34px;height:34px;cursor:pointer;font:700 .8rem inherit;color:var(--a-ink);padding:0 9px}

.mini:disabled{opacity:.35;cursor:default}
.mini.blue{background:var(--a-blue-soft);color:var(--a-blue)}
.presets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.preset{border:2px solid var(--a-line);border-radius:14px;overflow:hidden;cursor:pointer;background:#fff;padding:0;text-align:left;font:inherit;color:inherit}

.preset .bars i{flex:1}
.preset b{display:block;padding:8px 10px;font-size:.86rem}
.fonts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.fontc .s{font-size:1.7rem;line-height:1.05}
.fontc .s.body{font-size:.98rem;line-height:1.35}
.fontc b{font:700 .8rem system-ui,sans-serif}
.fontc small{font:500 .74rem system-ui,sans-serif;color:var(--a-muted)}
.contrast{font-size:.78rem;color:var(--a-warn);font-weight:600}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.88rem;font-weight:600}
.adm-login{position:fixed;inset:0;z-index:100;background:rgba(15,25,21,.55);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px}

.adm-login .lg img{height:28px}
.adm-login h2{margin:0;font-size:1.4rem}
.adm-login p{margin:0;color:var(--a-muted);font-size:.92rem}
.adm-login .err{color:var(--a-red);font-weight:600;font-size:.88rem}
.pw{position:relative}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--a-blue);font:700 .8rem inherit;cursor:pointer;padding:6px}
.adm-toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);z-index:120;background:#1B2420;color:#fff;padding:12px 18px;border-radius:12px;font:600 .9rem system-ui,sans-serif;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);max-width:min(520px,calc(100% - 32px))}
.adm-toast.bad{background:#7F1D2D}

function finder(a,h){

    let fit,cls,rank;
    if(okA&&okH){fit="Ideal";cls="fit-ideal";rank=0}
    else if(okA){fit="Revisa la altura";cls="fit-ok";rank=1}
    else if(Math.min(Math.abs(a-lo),Math.abs(a-hi))<=.5){fit="Revisa medidas";cls="fit-ok";rank=2}
    else{fit=a<lo?"Más adelante":"Ya lo superó";cls="fit-no";rank=3}
    const note=[p.ageLabel,hasH?`${p.hMin}–${p.hMax} cm`:""].filter(Boolean).join(" · ");
    return {p,fit,cls,rank,note};
  }).sort((x,y)=>x.rank-y.rank);

}

  if(t.dataset.days){D.days=+t.dataset.days;renderDash();return}
  if(t.dataset.src){D.linkSrc=t.dataset.src;renderDash();return}
  if(t.dataset.copy){const v=t.dataset.copy;navigator.clipboard?.writeText(v).then(()=>toast("Enlace copiado")).catch(()=>{const i=t.previousElementSibling;i?.select();toast("Selecciona el enlace y cópialo")});return}
  const a=t.dataset.act;
  if(a==="close"){closeDash();return}
  if(a==="exit"){closeDash();exitAdmin();return}
  if(a==="real"){D.demo=false;D.demoAuto=false;renderDash();return}
  if(a==="demo"){D.demo=true;D.demoAuto=false;renderDash();return}
  if(a==="new"){if(D.demo){D.demo=false;D.demoAuto=false;renderDash()}openLead(null);return}
  if(a==="csv"){exportCSV();return}
  if(t.classList.contains("lcard")&&!e.target.closest("select,a"))openLead(t.dataset.lid);
}
function dashInput(e){
  if(e.target.id==="dQ"){D.q=e.target.value;renderDash()}
  if(e.target.id==="dCamp"){D.linkCamp=e.target.value;const sel=e.target.selectionStart;renderDash();const i=$("#dCamp");if(i){i.focus();i.setSelectionRange(sel,sel)}}
}
async function dashChange(e){
  if(e.target.id==="dFsrc"){D.fsrc=e.target.value;renderDash();return}
  const id=e.target.dataset.st;if(!id)return;
  const l=dataset().leads.find(x=>x.id===id);if(!l)return;
  if(l.demo){toast("Este es un cliente de ejemplo. Cambia a tus datos reales para gestionar.",true);renderDash();return}
  const st=e.target.value,prod=data.products.find(p=>p.name===l.producto);
  await saveLead({...l,estado:st,monto:st==="vendido"&&!l.monto?(prod?.now||null):l.monto});
}
async function saveLead(l){
  const db=await getDb();if(!db){toast("Para guardar clientes abre esta página desde claude.ai con tu cuenta de editor.",true);return false}
  const{web,_sdoc,demo,...doc}=l;doc.actualizado=Date.now();
  if(doc.estado==="vendido"){if(!doc.vendidoAt)doc.vendidoAt=Date.now()}else doc.vendidoAt=null;
  try{await db.collection("clientes").doc(l.id).set(doc);toast("Cliente guardado");return true}
  catch(e){toast(e?.code==="invalid_argument"?"Tu cuenta no tiene permiso para guardar clientes. Pide acceso de Editor.":`No se pudo guardar (${e?.code||"error"}). Intenta de nuevo.`,true);return false}
}
async function deleteLead(l){
  const db=await getDb();if(!db)return false;
  try{
    await db.collection("clientes").doc(l.id).delete();
    if(l._sdoc){const s=D.real.solicitudes.find(x=>x._sdoc===l._sdoc);if(s){const{_sdoc,...rest}=s;await db.doc("solicitudes/"+l._sdoc).set({...rest,items:(s.items||[]).filter(i=>i.id!==l.id)})}}
    toast("Cliente eliminado");return true;
  }catch(e){toast(`No se pudo eliminar (${e?.code||"error"}).`,true);return false}
}
function openLead(id){
  const ex=id?dataset().leads.find(l=>l.id===id):null;
  const l=ex?{...ex}:{id:"c"+Date.now().toString(36),creado:Date.now(),nombre:"",telefono:"",producto:"",fuente:"instagram",estado:"nuevo",monto:null,notas:"",origen:"manual"};
  const ro=!!l.demo;
  const opt=(arr,cur)=>arr.map(([v,t])=>`<option value="${esc(v)}" ${v===cur?"selected":""}>${esc(t)}</option>`).join("");
  const prods=data.products.map(p=>[p.name,p.name]);if(l.producto&&!prods.some(p=>p[0]===l.producto))prods.push([l.producto,l.producto]);
  const ov=h("div",{class:"dmodal"});
  ov.innerHTML=`<form novalidate><h3>${ex?"Ficha del cliente":"Nuevo cliente potencial"}</h3>
  ${ro?`<p class="note" style="background:#FFF4DB;padding:10px;border-radius:10px;color:#6B4006">Cliente de ejemplo: no se puede editar.</p>`:""}
  ${l.web?`<p class="note">Llegó desde el formulario de la página el ${new Date(l.creado).toLocaleString("es-CL",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"})}.${l.edad?` Edad del peque: ${esc(l.edad)}.`:""}</p>`:""}
  <div class="f"><label for="mN">Nombre</label><input id="mN" value="${esc(l.nombre)}" required></div>
  <div class="two"><div class="f"><label for="mT">WhatsApp o teléfono</label><input id="mT" type="tel" value="${esc(l.telefono)}" placeholder="+56 9 1234 5678"></div>
  <div class="f"><label for="mF">¿Cómo nos conoció?</label><select id="mF">${opt(Object.entries(SOURCES),l.fuente)}</select></div></div>
  <div class="f"><label for="mP">Producto de interés</label><select id="mP"><option value="">Sin definir</option>${opt(prods,l.producto)}</select></div>
  <div class="f"><span class="lb">Estado</span><div class="stpick" role="group" aria-label="Estado">${STATES.map(([k,n])=>`<button type="button" data-s="${k}" aria-pressed="${k===(l.estado||"nuevo")}">${n}</button>`).join("")}</div></div>
  <div class="f" id="mMw" ${l.estado==="vendido"?"":"hidden"}><label for="mM">Monto de la venta (CLP)</label><input id="mM" inputmode="numeric" value="${l.monto??""}" placeholder="Ej: 49990"></div>
  <div class="f"><label for="mO">Notas</label><textarea id="mO" placeholder="Ej: quiere la bici menta, la llamo el viernes">${esc(l.notas||"")}</textarea></div>
  <p class="note" id="mErr" role="alert" hidden style="color:#B42318;font-weight:700"></p>
  <div class="foot"><span>${ex&&!ro?`<button class="dbtn" type="button" id="mDel" style="color:#B42318">Eliminar</button><span id="mConf" hidden> ¿Seguro? <button class="dbtn sm" type="button" id="mYes" style="background:#FCE8EC;color:#B42318">Sí, eliminar</button> <button class="dbtn sm" type="button" id="mNo">No</button></span>`:""}</span>
  <span style="display:flex;gap:8px">${waFor(l)}<button class="dbtn" type="button" id="mX">${ro?"Cerrar":"Cancelar"}</button>${ro?"":`<button class="dbtn pri" type="submit">Guardar</button>`}</span></div></form>`;
  document.body.appendChild(ov);
  const f=$("form",ov);let st=l.estado||"nuevo";
  if(ro)$$("input,select,textarea",f).forEach(i=>i.disabled=true);
  const close=()=>{ov.remove();renderDash()};
  $("#mX",ov).addEventListener("click",close);ov.addEventListener("click",e=>{if(e.target===ov)close()});ov.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
  $$(".stpick button",ov).forEach(b=>b.addEventListener("click",()=>{if(ro)return;st=b.dataset.s;$$(".stpick button",ov).forEach(x=>x.setAttribute("aria-pressed",x===b));$("#mMw",ov).hidden=st!=="vendido";
    if(st==="vendido"&&!$("#mM",ov).value){const p=data.products.find(p=>p.name===$("#mP",ov).value);if(p)$("#mM",ov).value=p.now}}));
  $("#mDel",ov)?.addEventListener("click",()=>{$("#mConf",ov).hidden=false});$("#mNo",ov)?.addEventListener("click",()=>{$("#mConf",ov).hidden=true});
  $("#mYes",ov)?.addEventListener("click",async()=>{if(await deleteLead(l))close()});
  f.addEventListener("submit",async e=>{e.preventDefault();if(ro)return;
    const nombre=$("#mN",ov).value.trim();if(!nombre){const er=$("#mErr",ov);er.textContent="Escribe al menos el nombre del cliente.";er.hidden=false;$("#mN",ov).focus();return}
    const monto=$("#mM",ov).value.replace(/\D/g,"");
    const ok=await saveLead({...l,nombre,telefono:$("#mT",ov).value.trim(),fuente:$("#mF",ov).value,producto:$("#mP",ov).value,estado:st,monto:monto?+monto:null,notas:$("#mO",ov).value.trim()});
    if(ok)close();});
  setTimeout(()=>$("#mN",ov).focus(),30);
}
async function exportCSV(){
  const L=dataset().leads,cell=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const csv=[["Fecha","Nombre","Teléfono","Producto","Origen","Estado","Monto","Notas"].map(cell).join(";"),...L.map(l=>[new Date(l.creado).toLocaleDateString("es-CL"),l.nombre,l.telefono,l.producto,srcName(l.fuente),STATE_NAME[l.estado]||"Nuevo",l.monto||"",l.notas].map(cell).join(";"))].join("\r\n");
  let dl=null;try{dl=window.claude?.use?await window.claude.use("downloads"):null}catch(e){}
  if(!dl){toast("Descargar no está disponible aquí. Abre la página desde claude.ai.",true);return}
  try{await dl.save({filename:`clientes-tomi-${dayKey(Date.now())}.csv`,data:new Blob(["﻿"+csv],{type:"text/csv"})})}catch(e){if(e?.code!=="cancelled"&&e?.code!=="declined")toast("No se pudo descargar la planilla.",true)}
}
addEventListener("resize",()=>{const a=$("#dArea");if(a)drawArea(a)});
startVisit();

})();
</script>
