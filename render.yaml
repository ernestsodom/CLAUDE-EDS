# Blueprint de Render para la herramienta de Licitaciones de Mercado Público.
# Render detecta este archivo en la raíz del repo. El servicio vive en la
# subcarpeta mercado-publico/ (rootDir), aislado del bot de Instagram.
services:
  - type: web
    name: mercado-publico-licitaciones
    runtime: python
    rootDir: mercado-publico
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      # MP_TICKET NO se define aquí a propósito: así el deploy arranca de un clic
      # usando el ticket de DEMOSTRACIÓN (cuota limitada). Cuando tengas tu propio
      # ticket, agrégalo en Render → Environment → Add: MP_TICKET = tu-ticket
      # y el servicio se redesplegará usándolo automáticamente.
