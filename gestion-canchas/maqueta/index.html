<title>Atila Gestión de Canchas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Saira:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: barra lateral de módulos + área de trabajo en paneles; la vista 3D de la cancha siempre en escena nocturna. */
:root {
  --bg: #0c1116; --surface: #131a21; --surface2: #1a232c; --line: #26323d;
  --fg: #e6ecf1; --muted: #8b98a4; --accent: #3d9bff; --accent-fg: #04121f;
  --lamp: #ffd27a; --ok: #3fbf7f; --warn: #e8a93a; --bad: #ef5a4f;
  --stage: #05080b;
  --f-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f2f4f6; --surface: #ffffff; --surface2: #eaeef2; --line: #d5dce3;
  --fg: #121a21; --muted: #5a6875; --accent: #1468c8; --accent-fg: #ffffff;
  --lamp: #a86e06; --ok: #1d8752; --warn: #a96d12; --bad: #c4372d; color-scheme: light } }
:root[data-theme="light"] {
  --bg: #f2f4f6; --surface: #ffffff; --surface2: #eaeef2; --line: #d5dce3;
  --fg: #121a21; --muted: #5a6875; --accent: #1468c8; --accent-fg: #ffffff;
  --lamp: #a86e06; --ok: #1d8752; --warn: #a96d12; --bad: #c4372d; color-scheme: light }

/* Línea gráfica ATILA (atilapadel.com): negro profundo, texto claro, acento menta, tipografía liviana en mayúsculas, bordes finos y esquinas rectas. */
:root[data-brand="atila"] {
  --bg: #0d0d0d; --surface: #141414; --surface2: #1d1d1d; --line: #2b2b2b;
  --fg: #f2f2f2; --muted: #a3a3a3; --accent: #41d7a7; --accent-fg: #0d0d0d;
  --lamp: #41d7a7; --ok: #41d7a7; --warn: #e9a23b; --bad: #e5564b; --r: 2px;
  --f-display: "Saira", "Arial Narrow", sans-serif; --f-body: "Saira", system-ui, sans-serif; color-scheme: dark }
@media (prefers-color-scheme: light) { :root[data-brand="atila"]:not([data-theme="dark"]) {
  --bg: #f4f4f3; --surface: #ffffff; --surface2: #ececea; --line: #d9d9d6;
  --fg: #0d0d0d; --muted: #5c5c5c; --accent: #14946c; --accent-fg: #ffffff; --lamp: #14946c; --ok: #14946c; --warn: #a86a0c; --bad: #c4372d; color-scheme: light } }
:root[data-brand="atila"][data-theme="light"] {
  --bg: #f4f4f3; --surface: #ffffff; --surface2: #ececea; --line: #d9d9d6;
  --fg: #0d0d0d; --muted: #5c5c5c; --accent: #14946c; --accent-fg: #ffffff; --lamp: #14946c; --ok: #14946c; --warn: #a86a0c; --bad: #c4372d; color-scheme: light }

* { box-sizing: border-box }
html, body { height: 100% }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.45 }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; letter-spacing: .01em; text-wrap: balance; margin: 0; line-height: 1.1 }
h1 { font-size: 30px } h2 { font-size: 22px } h3 { font-size: 17px; text-transform: uppercase; letter-spacing: .06em }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums }
.muted { color: var(--muted) }
.small { font-size: 12px }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600 }

.app { display: grid; grid-template-columns: 232px 1fr; min-height: 100% }
.side { background: var(--surface); border-right: 1px solid var(--line); padding-block: 18px; padding-inline: 14px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh }
.brand { display: flex; align-items: center; gap: 10px }
.brand svg { flex: none }
.brand b { font-family: var(--f-display); font-size: 21px; letter-spacing: .04em; text-transform: uppercase; display: block; line-height: 1 }
.brand span { font-size: 11px; color: var(--muted) }
.profiles { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface2); border-radius: 8px; padding: 3px; gap: 3px }
.profiles button { border: 0; background: transparent; padding: 7px 4px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--muted) }
.profiles button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg) }
.nav { display: flex; flex-direction: column; gap: 2px }
.nav button { display: flex; align-items: center; gap: 10px; border: 0; background: transparent; padding: 9px 10px; border-radius: 7px; text-align: left; color: var(--muted); font-weight: 500 }
.nav button:hover { background: var(--surface2); color: var(--fg) }
.nav button svg { flex: none }
.nav button[aria-current="page"] { background: var(--surface2); color: var(--fg); box-shadow: inset 2px 0 0 var(--accent) }
.nav .count { margin-left: auto; font-family: var(--f-mono); font-size: 11px; background: var(--line); color: var(--fg); border-radius: 10px; padding: 0 7px }
.side-foot { margin-top: auto; font-size: 11px; color: var(--muted); display: grid; gap: 8px }
.side-foot button { justify-self: start }

.main { min-width: 0; padding-block: 22px 40px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap }
.head p { margin: 4px 0 0; color: var(--muted); max-width: 70ch }

.btn { border: 1px solid var(--line); background: var(--surface2); padding: 7px 12px; border-radius: 7px; font-weight: 500; font-size: 13px }
.btn:hover { border-color: var(--muted) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600 }
.btn.ghost { background: transparent }
.btn.sm { padding: 4px 9px; font-size: 12px }
.btn.danger { color: var(--bad) }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0 }
.panel > .ph { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap }
.panel > .pb { padding: 16px }
.split { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 16px; align-items: start }
.split > * { min-width: 0 }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; border: 1px solid currentColor; white-space: nowrap; line-height: 1.5 }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor }
.st-ok { color: var(--ok) } .st-warn { color: var(--warn) } .st-bad { color: var(--bad) } .st-acc { color: var(--accent) } .st-mut { color: var(--muted) }

/* Bandeja */
.tabs { display: flex; gap: 4px; flex-wrap: wrap }
.tabs button { border: 1px solid var(--line); background: transparent; border-radius: 20px; padding: 4px 11px; font-size: 12px; color: var(--muted) }
.tabs button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg) }
.inbox { list-style: none; margin: 0; padding: 0 }
.inbox li button { width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 12px 16px; display: grid; grid-template-columns: 1fr auto; gap: 3px 10px }
.inbox li button:hover { background: var(--surface2) }
.inbox li button[aria-current="true"] { background: var(--surface2); box-shadow: inset 3px 0 0 var(--accent) }
.inbox .t { font-weight: 600 }
.inbox .s { color: var(--muted); font-size: 12px; grid-column: 1 / -1 }
.funnel { display: grid; grid-template-columns: repeat(6, 1fr); gap: 1px; background: var(--line); border-radius: 8px; overflow: hidden; border: 1px solid var(--line) }
.funnel div { background: var(--surface); padding: 10px 12px }
.funnel b { font-family: var(--f-display); font-size: 26px; display: block; line-height: 1 }
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; margin: 0 }
.kv dt { color: var(--muted) } .kv dd { margin: 0 }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 0 }
.log li { display: grid; grid-template-columns: 78px 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 13px }
.log li:last-child { border-bottom: 0 }
.log .d { color: var(--muted); font-family: var(--f-mono); font-size: 12px }
.closebox { border: 1px solid var(--accent); border-radius: 10px; padding: 14px; display: grid; gap: 10px; background: color-mix(in srgb, var(--accent) 7%, transparent) }

.form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px }
.form .full { grid-column: 1 / -1 }
.field { display: grid; gap: 4px; min-width: 0 }
.field > span { font-size: 12px; color: var(--muted); font-weight: 500 }
input[type=text], input[type=password], input[type=date], input[type=number], select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; width: 100%; min-width: 0 }
textarea { resize: vertical; min-height: 60px }
.check { display: flex; align-items: center; gap: 8px }

/* Proyectos */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px }
.tipos { display: grid; gap: 6px }
.tipo { display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left; border: 1px solid var(--line); background: var(--bg); padding: 10px 12px; border-radius: var(--r, 7px) }
.tipo[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent) }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px }
.kpi b { font-family: var(--f-display); font-size: 28px; line-height: 1 }
.plist { display: grid; gap: 8px }
.pcard { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px }
.pcard:hover { border-color: var(--muted) }
.pcard[aria-current="true"] { border-color: var(--accent) }
.pcard .top { display: flex; justify-content: space-between; gap: 8px; align-items: start }
.pcard .t { font-weight: 600 }
.bar { height: 5px; background: var(--surface2); border-radius: 3px; overflow: hidden; display: flex; gap: 2px }
.bar i { flex: 1; background: var(--line) }
.bar i.done { background: var(--ok) } .bar i.cur { background: var(--accent) } .bar i.late { background: var(--bad) }

.gantt { display: grid; gap: 6px; overflow-x: auto }
.grow { display: grid; grid-template-columns: 170px 1fr; gap: 10px; align-items: center; min-width: 560px }
.gtrack { position: relative; height: 26px; background: var(--surface2); border-radius: 5px }
.gbar { position: absolute; top: 4px; bottom: 4px; border-radius: 4px; min-width: 8px; background: var(--line); display: flex; align-items: center; padding: 0 6px; font-size: 11px; font-family: var(--f-mono); white-space: nowrap; overflow: hidden; color: var(--fg) }
.gbar.done { background: color-mix(in srgb, var(--ok) 55%, var(--surface2)) }
.gbar.cur { background: var(--accent); color: var(--accent-fg) }
.gbar.late { background: var(--bad); color: #fff }
.gtoday { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--lamp); z-index: 2 }
.gaxis { display: grid; grid-template-columns: 170px 1fr; gap: 10px; min-width: 560px }
.gaxis div { position: relative; height: 16px; font-size: 11px; color: var(--muted); font-family: var(--f-mono) }
.gaxis > div span { position: absolute; transform: translateX(-50%); white-space: nowrap }

.stages { list-style: none; margin: 0; padding: 0; display: grid }
.stages li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line) }
.stages li:last-child { border-bottom: 0 }
.dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 11px; font-weight: 700; font-family: var(--f-mono) }
.dot.done { background: var(--ok); border-color: var(--ok); color: #fff }
.dot.cur { border-color: var(--accent); color: var(--accent) }
.dot.late { border-color: var(--bad); color: var(--bad) }
.dates { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 4px }
.dates input { width: auto; padding: 3px 6px; font-size: 12px }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 16px }
.two > * { min-width: 0 }

/* Escena 3D */
.scene { background: var(--stage); border-radius: 10px; overflow: hidden; border: 1px solid var(--line) }
.scene { position: relative }
.scene canvas { display: block; width: 100%; height: auto; aspect-ratio: 1200 / 840; max-width: 100% }
.scene-label { position: absolute; left: 14px; bottom: 10px; font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: #9aa6b1 }

/* Calendario */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden }
.cal .dh { background: var(--surface2); padding: 6px 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600 }
.cal .dc { background: var(--surface); min-height: 104px; padding: 6px; display: flex; flex-direction: column; gap: 3px; min-width: 0 }
.cal .dc.out { background: var(--bg) }
.cal .dc.today { box-shadow: inset 0 0 0 2px var(--lamp) }
.cal .n { font-family: var(--f-mono); font-size: 12px; color: var(--muted) }
.ev { border: 0; text-align: left; font-size: 11px; padding: 2px 5px; border-radius: 4px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; width: 100% }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted) }
.legend span { display: inline-flex; align-items: center; gap: 6px }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block }

/* Mapa */
.agenda { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start }
.agenda > * { min-width: 0 }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 12px }
.pcard .top { align-items: center }
.map { position: relative; overflow: hidden }
.map svg { width: 100%; height: 620px; display: block; touch-action: none; cursor: grab; user-select: none }
.map svg:active { cursor: grabbing }
.mapctl { position: absolute; top: 10px; right: 10px; display: flex; gap: 4px; align-items: center; z-index: 2; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px }
.mapctl .btn.sm { min-width: 28px }
.maphint { padding: 8px 12px; border-top: 1px solid var(--line) }
.land.uru { opacity: .6 }
.country { font: 600 6px var(--f-body); letter-spacing: .1em; fill: var(--muted); text-anchor: middle; pointer-events: none }
.land { fill: var(--surface2); stroke: var(--muted); stroke-width: 1; vector-effect: non-scaling-stroke }
.city circle { fill: var(--muted); opacity: .6 }
.city text { display: none; font: 400 7px var(--f-body); fill: var(--muted) }
svg.zoomed2 .city text { display: inline }
svg .city.has text { display: none }
.mlabel { display: none; font: 600 10px var(--f-body); fill: var(--fg); stroke: var(--surface); stroke-width: 4px; paint-order: stroke; pointer-events: none }
.mlabel.sub { font-weight: 500; font-size: 8px; fill: var(--muted) }
svg.zoomed .mlabel, .mk.sel .mlabel { display: inline }
.mk { cursor: pointer }
.mk circle.halo { opacity: .25 }
.mk.sel circle.core { stroke: var(--fg); stroke-width: 2 }
.maplist { display: grid; gap: 0 }
.maplist button { border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; padding: 10px 14px; display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: center }
.maplist button:hover, .maplist button[aria-current="true"] { background: var(--surface2) }
.sw { width: 10px; height: 10px; border-radius: 50% }

/* Configurador */
.cfg { display: grid; grid-template-columns: 330px 1fr; gap: 16px; align-items: start }
.cfg > * { min-width: 0 }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; align-items: center }
.swatches button { width: 26px; height: 26px; border-radius: 6px; border: 2px solid var(--line); padding: 0 }
.swatches button[aria-pressed="true"] { border-color: var(--fg) }
.swatches input[type=color] { width: 34px; height: 28px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); padding: 2px }
.typebadge { font-family: var(--f-display); font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--lamp) }
.disabled { opacity: .45; pointer-events: none }
.logo-prev { width: 90px; height: 46px; background: var(--bg); border: 1px dashed var(--line); border-radius: 6px; display: grid; place-items: center; overflow: hidden }
.logo-prev img { max-width: 100%; max-height: 100% }

table.models { width: 100%; border-collapse: collapse }
table.models th, table.models td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle }
table.models th { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600 }
.tablewrap { overflow-x: auto }

.empty { padding: 40px 20px; text-align: center; color: var(--muted); display: grid; gap: 8px; justify-items: center }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 8px; font-weight: 500; z-index: 20; box-shadow: 0 6px 20px rgb(0 0 0 / .3) }

@media (max-width: 1100px) {
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)) }
  .funnel { grid-template-columns: repeat(3, 1fr) }
  .cfg, .agenda { grid-template-columns: 1fr }
}
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr) }
  .side { min-width: 0 }
  .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); gap: 12px }
  .nav { flex-direction: row; overflow-x: auto }
  .nav button { white-space: nowrap }
  .side-foot { display: none }
  .main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
  .split, .two { grid-template-columns: 1fr }
  .form { grid-template-columns: 1fr }
  .kv { grid-template-columns: 110px 1fr }
  .cal .dc { min-height: 70px }
  .map svg { height: 440px }
  .cal .ev { font-size: 0; height: 6px; padding: 0 }
}
@media (prefers-reduced-motion: no-preference) { .gbar, .pcard, .nav button { transition: background .15s, border-color .15s } }

/* Marca en la barra lateral */
.logo { display: none; width: 150px; height: auto }
:root[data-brand="atila"] .brand > svg, :root[data-brand="atila"] #brandName { display: none }
:root[data-brand="atila"] .brand { flex-direction: column; align-items: flex-start; gap: 8px }
:root[data-brand="atila"] .logo-claro { display: block }
@media (prefers-color-scheme: light) { :root[data-brand="atila"]:not([data-theme="dark"]) .logo-claro { display: none }
  :root[data-brand="atila"]:not([data-theme="dark"]) .logo-oscuro { display: block } }
:root[data-brand="atila"][data-theme="light"] .logo-claro { display: none }
:root[data-brand="atila"][data-theme="light"] .logo-oscuro { display: block }
:root[data-brand="atila"] .brand span { letter-spacing: .1em; text-transform: uppercase; font-size: 9.5px }

/* Componentes con la línea ATILA */
:root[data-brand="atila"] body { font-weight: 300 }
:root[data-brand="atila"] h1 { font-weight: 300; font-size: 36px; text-transform: uppercase; letter-spacing: -.02em }
:root[data-brand="atila"] h1 em, :root[data-brand="atila"] h2 em { font-style: normal; color: var(--accent) }
:root[data-brand="atila"] h2 { font-weight: 400; text-transform: uppercase; letter-spacing: -.01em }
:root[data-brand="atila"] h3 { font-weight: 400; letter-spacing: .14em; font-size: 14px }
:root[data-brand="atila"] b, :root[data-brand="atila"] strong, :root[data-brand="atila"] .t { font-weight: 500 }
:root[data-brand="atila"] .label { color: var(--accent); letter-spacing: .22em; font-weight: 400 }
:root[data-brand="atila"] .panel, :root[data-brand="atila"] .kpi, :root[data-brand="atila"] .pcard, :root[data-brand="atila"] .scene,
:root[data-brand="atila"] .cal, :root[data-brand="atila"] .funnel, :root[data-brand="atila"] .closebox { border-radius: var(--r) }
:root[data-brand="atila"] .btn { border-radius: var(--r); text-transform: uppercase; letter-spacing: .06em; font-weight: 400; font-size: 12px }
:root[data-brand="atila"] .btn.primary { font-weight: 500 }
:root[data-brand="atila"] .btn.ghost { border-color: var(--accent); color: var(--accent) }
:root[data-brand="atila"] .profiles, :root[data-brand="atila"] .profiles button, :root[data-brand="atila"] .nav button,
:root[data-brand="atila"] input, :root[data-brand="atila"] select, :root[data-brand="atila"] .tabs button, :root[data-brand="atila"] .pill { border-radius: var(--r) }
:root[data-brand="atila"] .nav button { text-transform: uppercase; letter-spacing: .04em; font-size: 11.5px; font-weight: 400; white-space: nowrap }
:root[data-brand="atila"] .nav button[aria-current="page"] { color: var(--accent) }
:root[data-brand="atila"] .kpi b { font-weight: 300; font-size: 34px }
:root[data-brand="atila"] .typebadge { color: var(--accent); font-family: var(--f-body); font-weight: 400; letter-spacing: .14em }

/* Tarjetas de proyecto: todo el contenido toma el color de su estado */
.st-card { --c: #3a3f44; --t: #f2f2f2; background: var(--c); color: var(--t); border-color: transparent }
.st-card:hover { border-color: var(--fg) }
.st-card .muted { color: inherit; opacity: .78 }
.st-card .bar { background: transparent }
.st-card .bar i { background: currentColor; opacity: .22 }
.st-card .bar i.done { opacity: .95 } .st-card .bar i.cur { opacity: .6 } .st-card .bar i.late { opacity: .6 }
.st-card .pill { color: inherit }
.cardlegend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted) }
.cardlegend span { display: inline-flex; gap: 6px; align-items: center }
.cardlegend i { width: 14px; height: 14px; border-radius: var(--r, 3px); display: inline-block }

/* Ingreso y usuarios */
[hidden] { display: none !important }
h1 em, h2 em { font-style: normal; color: var(--accent) }
body.no-session .side { display: none }
body.no-session .app { grid-template-columns: minmax(0, 1fr) }
.login { min-height: 80vh; display: grid; place-items: center }
.login-card { width: min(400px, 100%) }
.userbox { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px }
table.users td { vertical-align: top }

/* Amortiguadores y archivos */
.amortwrap { display: grid; grid-template-columns: minmax(240px, 380px) 1fr; gap: 20px }
.amortwrap > * { min-width: 0 }
.amortbox { background: linear-gradient(180deg, #ebe8e1, #c8c3b8); border-radius: var(--r, 8px); border: 1px solid var(--line) }
.amortbox svg { display: block; width: 100%; height: auto }
.ralsel { display: flex; gap: 10px; align-items: center }
.ralsel i { width: 40px; height: 40px; border-radius: var(--r, 6px); border: 1px solid var(--line); flex: none }
.ralgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 5px; max-height: 420px; overflow-y: auto; padding: 2px }
.ralsw { aspect-ratio: 1; border: 2px solid transparent; border-radius: var(--r, 5px); padding: 0; display: flex; align-items: flex-end; justify-content: center; position: relative }
.ralsw span { font: 500 9px var(--f-mono); background: rgb(0 0 0 / .45); color: #fff; padding: 0 3px; margin-bottom: 3px; border-radius: 2px }
.ralsw[aria-pressed="true"] { border-color: var(--fg); box-shadow: 0 0 0 2px var(--accent) }
.filebox { display: flex; gap: 10px; align-items: center; padding: 8px; border: 1px dashed var(--line); border-radius: var(--r, 6px) }
.filebox img { width: 96px; height: 64px; object-fit: contain; background: var(--bg) }
.fileic { width: 56px; height: 64px; display: grid; place-items: center; background: var(--surface2); font: 600 12px var(--f-mono); border-radius: var(--r, 4px) }
@media (max-width: 860px) { .amortwrap { grid-template-columns: 1fr } }
</style>

    const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));

  construccion: { label: 'En construcción', c: '#e9a23b', t: '#0d0d0d' },

function cardState(p) {
  const c = current(p);
  if (!c) return 'fin';
  if (p.etapas.some(isLate)) return 'atraso';
  if (c.estado === 'pendiente' || c.key === 'venta') return 'espera';
  if (c.key === 'salida' || c.key === 'entrega') return 'transito';
  if (c.key === 'habilitada') return 'instalacion';
  return c.key;
}

function gantt(p) {
  let a = p.etapas[0].inicio, b = p.etapas[p.etapas.length - 1].fin;
  if (TODAY < a) a = TODAY; if (TODAY > b) b = TODAY;
  a = addDays(a, -2); b = addDays(b, 3);
  const span = diffDays(a, b) + 1, pct = iso => (diffDays(a, iso) / span * 100);
  const ticks = []; for (let i = 0; i <= span; i += Math.max(7, Math.round(span / 6))) ticks.push(addDays(a, i));
  const todayL = pct(TODAY) + (0.5 / span * 100);
  return `<div class="gantt">
    ${p.etapas.map(e => { const cls = e.estado === 'completada' ? 'done' : isLate(e) ? 'late' : e.estado === 'en_curso' ? 'cur' : '';
      const w = Math.max((diffDays(e.inicio, e.fin) + 1) / span * 100, 1.2);
      return `<div class="grow"><span class="small">${stageName(e.key)}</span><div class="gtrack"><div class="gtoday" style="left:${todayL}%"></div>
        <div class="gbar ${cls}" style="left:${pct(e.inicio)}%;width:${w}%" title="${fmtY(e.inicio)} → ${fmtY(e.fin)}">${w > 16 ? fmt(e.inicio) + ' – ' + fmt(e.fin) : ''}</div></div></div>`; }).join('')}
    <div class="gaxis"><i></i><div>${ticks.map(t => `<span style="left:${pct(t)}%">${fmt(t)}</span>`).join('')}</div></div>
  </div>`;
}

function projectDetail(p) {

    <div class="pb" style="display:grid;gap:12px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h3>Línea de tiempo</h3><span class="legend"><span><i style="background:var(--lamp)"></i>Hoy ${fmt(TODAY)}</span><span><i style="background:var(--ok)"></i>Completada</span><span><i style="background:var(--accent)"></i>En curso</span><span><i style="background:var(--bad)"></i>Atrasada</span></span></div>${gantt(p)}</div></div>
  <div class="two">

      ${projFiles(p)}

/* ---------- Mapa con zoom ---------- */
const MAPW = 215, MAPH = 425, ZMAX = 60;
UI.map = { z: 1, cx: MAPW / 2, cy: MAPH / 2 };
const mapVB = () => { const { z, cx, cy } = UI.map, w = MAPW / z, h = MAPH / z; return [cx - w / 2, cy - h / 2, w, h]; };
function mapClamp() {
  const m = UI.map; m.z = Math.min(ZMAX, Math.max(1, m.z));
  m.cx = Math.min(MAPW, Math.max(0, m.cx)); m.cy = Math.min(MAPH, Math.max(0, m.cy));
  if (m.z === 1) { m.cx = MAPW / 2; m.cy = MAPH / 2; }
}
function applyMap() {
  const svg = $('#agmap'); if (!svg) return;
  mapClamp();
  svg.setAttribute('viewBox', mapVB().map(v => v.toFixed(3)).join(' '));
  const s = (1 / UI.map.z).toFixed(4);
  svg.querySelectorAll('[data-x]').forEach(g => g.setAttribute('transform', `translate(${g.dataset.x} ${g.dataset.y}) scale(${s})`));
  svg.classList.toggle('zoomed', UI.map.z >= 2.5);
  svg.classList.toggle('zoomed2', UI.map.z >= 5);
  const zl = $('#mapzl'); if (zl) zl.textContent = `${UI.map.z < 10 ? UI.map.z.toFixed(1) : Math.round(UI.map.z)}×`;
}
function mapZoomAt(px, py, f) {
  const m = UI.map, nz = Math.min(ZMAX, Math.max(1, m.z * f));
  m.cx = px - (px - m.cx) * (m.z / nz); m.cy = py - (py - m.cy) * (m.z / nz); m.z = nz; applyMap();
}
function mapFocus(p) { if (!p) return; UI.map.cx = MX(p.lon); UI.map.cy = MY(p.lat); UI.map.z = Math.max(UI.map.z, 12); }
function setupMap() {
  const svg = $('#agmap'); if (!svg) return;
  applyMap();
  const toSvg = (x, y) => { const pt = svg.createSVGPoint(); pt.x = x; pt.y = y; return pt.matrixTransform(svg.getScreenCTM().inverse()); };
  const ptrs = new Map(); let start = null, moved = false, pinch = null;
  svg.addEventListener('wheel', e => { e.preventDefault(); const p = toSvg(e.clientX, e.clientY); mapZoomAt(p.x, p.y, e.deltaY < 0 ? 1.25 : 0.8); }, { passive: false });
  svg.addEventListener('dblclick', e => { e.preventDefault(); const p = toSvg(e.clientX, e.clientY); mapZoomAt(p.x, p.y, 2); });
  svg.addEventListener('pointerdown', e => {
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = false;
    if (ptrs.size === 1) start = { x: e.clientX, y: e.clientY, cx: UI.map.cx, cy: UI.map.cy, p: toSvg(e.clientX, e.clientY) };
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: UI.map.z }; }
  });
  svg.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 2 && pinch) {
      const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y), mid = toSvg((a.x + b.x) / 2, (a.y + b.y) / 2);
      mapZoomAt(mid.x, mid.y, (pinch.z * d / pinch.d) / UI.map.z); moved = true; return;
    }
    if (!start) return;
    if (!moved && Math.hypot(e.clientX - start.x, e.clientY - start.y) < 4) return;
    if (!moved) { moved = true; svg.setPointerCapture(e.pointerId); }
    const cur = toSvg(e.clientX, e.clientY);
    UI.map.cx -= cur.x - start.p.x; UI.map.cy -= cur.y - start.p.y; applyMap();
  });
  const end = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; if (!ptrs.size) start = null; };
  svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
  svg.addEventListener('click', e => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
}

    const st = pStatus(p), on = UI.calProject === p.id, short = p.nombre.split(' — ')[0];

      </div>

}

/* ===================== Acciones ===================== */
function logP(p, t, f = TODAY) { p.traza.push({ f, t: t + who() }); }
function commit(msg) { save(); render(); if (msg) toast(msg); }

document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const id = b.dataset.id, act = b.dataset.act;
  const deal = () => S.deals.find(d => d.id === id);
  switch (act) {
    case 'profile': if (!canSee(id)) break; UI.profile = id; if (['usuarios', 'clave', 'inicio'].includes(UI.view)) UI.view = id === 'atila' ? 'bandeja' : 'inicio'; saveUI(); render(); break;
    case 'logout': setSession(null); UI.loginError = ''; render(); break;
    case 'newuser': UI.newUser = !UI.newUser; UI.formError = ''; render(); break;
    case 'ureset': UI.resetUser = UI.resetUser === id ? null : id; UI.delUser = null; render(); break;
    case 'udel': UI.delUser = id || null; UI.resetUser = null; render(); break;
    case 'udelok': { const u = USERS.find(x => x.id === id);
      if (u.rol === 'superadmin' && activeSupers().length <= 1) { toast('Debe quedar al menos un super administrador activo.'); break; }
      USERS = USERS.filter(x => x.id !== id); UI.delUser = null; saveUsers(); render(); toast(`Usuario ${u.usuario} eliminado`); break; }
    case 'view': UI.view = id; UI.formError = ''; UI.cfg = null; UI.projOpen = false; saveUI(); render(); window.scrollTo(0, 0); break;
    case 'theme': document.documentElement.dataset.theme = id; try { localStorage.setItem(KEY + '-theme', id); } catch (e) {} renderNav(); break;
    case 'reset': S = seed(); UI.deal = null; UI.project = 'p1'; UI.cfg = null; commit('Datos del Excel cargados de nuevo'); break;
    case 'dfilter': UI.dealFilter = id; UI.deal = null; UI.closing = false; render(); break;
    case 'deal': UI.deal = id; UI.closing = false; render(); break;
    case 'newdeal': UI.newDeal = !UI.newDeal; render(); break;
    case 'advance': { const d = deal(), i = DEAL_STAGES.findIndex(s => s.key === d.etapa); d.etapa = DEAL_STAGES[i + 1].key; d.actualizado = TODAY;
      d.hist.push({ f: TODAY, t: `Etapa cambiada a «${DEAL_STAGES[i + 1].nombre}».` }); commit('Negocio actualizado'); break; }
    case 'lose': { const d = deal(); d.etapa = 'perdida'; d.actualizado = TODAY; d.hist.push({ f: TODAY, t: 'Negocio marcado como perdido.' }); commit('Negocio marcado como perdido'); break; }
    case 'closeopen': UI.closing = true; render(); break;
    case 'closecancel': UI.closing = false; render(); break;
    case 'openproj': UI.profile = 'atila'; UI.view = 'proyectos'; UI.project = id; UI.projOpen = true; saveUI(); render(); window.scrollTo(0, 0); break;
    case 'projback': UI.projOpen = false; render(); window.scrollTo(0, 0); break;
    case 'design': UI.view = 'configurador'; cfgInit(id); saveUI(); render(); window.scrollTo(0, 0); break;
    case 'stage-start': case 'stage-done': case 'stage-undo': {
      const p = project(id), e = p.etapas[+b.dataset.i];
      if (act === 'stage-start') { e.estado = 'en_curso'; logP(p, `Etapa iniciada: ${stageName(e.key)}.`); }
      if (act === 'stage-done') { e.estado = 'completada'; e.hecho = TODAY; logP(p, `Etapa completada: ${stageName(e.key)}.`);
        const nx = p.etapas[+b.dataset.i + 1]; if (nx && nx.inicio <= TODAY) { nx.estado = 'en_curso'; logP(p, `Etapa iniciada: ${stageName(nx.key)}.`); } }
      if (act === 'stage-undo') { e.estado = 'en_curso'; e.hecho = ''; p.etapas.slice(+b.dataset.i + 1).forEach(n => n.estado = 'pendiente'); logP(p, `Etapa reabierta: ${stageName(e.key)}.`); }
      commit(act === 'stage-done' ? `${stageName(e.key)}: completada` : null); break; }
    case 'calprev': case 'calnext': { const [y, m] = UI.cal.split('-').map(Number); const d = new Date(y, m - 1 + (act === 'calnext' ? 1 : -1), 1); UI.cal = isoOf(d).slice(0, 7); render(); break; }
    case 'caltoday': UI.cal = TODAY.slice(0, 7); render(); break;
    case 'mapsel': UI.calProject = UI.calProject === id ? '' : id; if (UI.calProject) mapFocus(project(id)); render(); break;
    case 'mapzoom': if (id === 'all') UI.map = { z: 1, cx: MAPW / 2, cy: MAPH / 2 }; else UI.map.z *= id === 'in' ? 2 : 0.5; applyMap(); break;
    case 'mapclear': UI.calProject = ''; render(); break;
    case 'sw': UI.cfg[b.dataset.field] = b.dataset.val; render(); break;
    case 'cfgmodel': UI.cfg.modelo = id; render(); break;
    case 'cfgsave': { const c = UI.cfg, p = project(c.pid);
      p.modelo = c.modelo; p.diseno = { pasto: c.pasto, amort: c.amort }; p.cesped = cespedName(c.pasto);
      p.archivos = { logo: c.logo, logoAmort: c.logoAmort, logoPuertas: c.logoPuertas, mapa: c.mapa };
      logP(p, `Diseño actualizado: ${model(c.modelo).nombre}, césped ${cespedName(c.pasto).toLowerCase()}, amortiguadores ${c.amort.ral} ${c.amort.nombre}${c.logo ? ', logo ' + [c.logoAmort && 'en amortiguadores', c.logoPuertas && 'sobre puertas'].filter(Boolean).join(' y ') : ''}${c.mapa ? ', mapa adjunto' : ''}.`);
      commit(save() ? 'Guardado en el proyecto' : null); break; }
    case 'ralfam': UI.ralFam = id; render(); break;
    case 'amort': { const r = RAL.find(x => x.ral === b.dataset.ral); UI.cfg.amort = { ral: r.ral, hex: r.hex, nombre: r.nombre }; updAmort(); break; }
    case 'filedel': UI.cfg[id] = null; if (id === 'logo') { UI.cfg.logoAmort = UI.cfg.logoPuertas = false; } render(); break;
  }
});

document.addEventListener('change', ev => {
  const t = ev.target, f = t.dataset.field; if (!f) return;
  if (f === 'inicio' || f === 'fin') {
    const p = project(t.dataset.id), e = p.etapas[+t.dataset.i]; if (!t.value) return;
    const old = e[f]; e[f] = t.value; if (e.fin < e.inicio) e[f === 'inicio' ? 'fin' : 'inicio'] = t.value;
    logP(p, `Reprogramada ${stageName(e.key).toLowerCase()}: ${f} ${fmtY(old)} → ${fmtY(t.value)}.`); commit('Fecha actualizada'); return;
  }
  if (f.startsWith('u-')) {
    const u = USERS.find(x => x.id === t.dataset.id);
    if (f === 'u-neg') u.negocios = t.checked ? [...new Set([...u.negocios, t.dataset.neg])] : u.negocios.filter(n => n !== t.dataset.neg);
    if (f === 'u-rol') { if (u.rol === 'superadmin' && t.value !== 'superadmin' && activeSupers().length <= 1) { toast('Debe quedar al menos un super administrador activo.'); render(); return; } u.rol = t.value; }
    if (f === 'u-activo') { if (!t.checked && u.rol === 'superadmin' && activeSupers().length <= 1) { toast('Debe quedar al menos un super administrador activo.'); render(); return; } u.activo = t.checked; }
    saveUsers(); render(); toast('Permisos actualizados'); return;
  }
  if (f === 'cfg-logoAmort' || f === 'cfg-logoPuertas') { UI.cfg[f.slice(4)] = t.checked; render(); return; }
  if (f === 'cfg-file') { const file = t.files[0], kind = t.dataset.kind; if (!file) return;
    if (file.size > 2 * 1024 * 1024) { toast(`«${file.name}» pesa más de 2 MB. Usa un archivo más liviano.`); t.value = ''; return; }
    const r = new FileReader(); r.onload = () => { UI.cfg[kind] = { name: file.name, type: file.type || 'application/octet-stream', size: file.size, data: r.result };
      if (kind === 'logo' && !UI.cfg.logoAmort && !UI.cfg.logoPuertas) UI.cfg.logoAmort = true; render(); toast('Archivo listo. Guarda para dejarlo en el proyecto.'); }; r.readAsDataURL(file); return; }
  if (f === 'calProject') { UI.calProject = t.value; render(); return; }
  if (f === 'mapProv') { UI.mapProv = t.value; UI.calProject = ''; render(); return; }
  if (f === 'cfg-pid') { if (t.value) cfgInit(t.value); else UI.cfg.pid = ''; render(); return; }
  if (f.startsWith('cfg-') && t.type === 'color') { UI.cfg[f.slice(4)] = t.value; render(); return; }
  if (f.startsWith('m-')) { const m = S.models.find(x => x.id === t.dataset.id); m[f.slice(2)] = t.value; commit('Tipo de cancha actualizado'); }
});

document.addEventListener('submit', async ev => {
  const f = ev.target, kind = f.dataset.form; if (!kind) return;
  ev.preventDefault();
  const fd = Object.fromEntries(new FormData(f));
  if (kind === 'login') {
    const u = USERS.find(x => x.usuario.toLowerCase() === fd.usuario.trim().toLowerCase());
    if (!u || u.hash !== await hashPw(u.usuario, fd.clave)) { UI.loginError = 'Usuario o contraseña incorrectos.'; render(); return; }
    if (!u.activo) { UI.loginError = 'Este usuario está desactivado. Pide al super administrador que lo reactive.'; render(); return; }
    UI.loginError = ''; setSession(u.id); render(); toast(`Hola, ${u.nombre}`); return;
  }
  if (kind === 'pwchange') {
    const u = me();
    if (u.hash !== await hashPw(u.usuario, fd.actual)) { UI.formError = 'La contraseña actual no es correcta.'; render(); return; }
    if (fd.nueva !== fd.repetir) { UI.formError = 'Las contraseñas nuevas no coinciden.'; render(); return; }
    u.hash = await hashPw(u.usuario, fd.nueva); saveUsers(); UI.formError = ''; UI.view = UI.profile === 'atila' ? 'bandeja' : 'inicio'; render(); toast('Contraseña actualizada'); return;
  }
  if (kind === 'newuser') {
    const usuario = fd.usuario.trim();
    if (USERS.some(x => x.usuario.toLowerCase() === usuario.toLowerCase())) { UI.formError = `El usuario «${usuario}» ya existe. Elige otro.`; render(); return; }
    const negocios = Object.keys(NEGOCIOS).filter(k => fd['neg_' + k]);
    USERS.push({ id: uid('u'), usuario, nombre: fd.nombre.trim(), rol: fd.rol, negocios, activo: true, hash: await hashPw(usuario, fd.clave) });
    saveUsers(); UI.newUser = false; UI.formError = ''; render(); toast(`Usuario ${usuario} creado`); return;
  }
  if (kind === 'pwreset') {
    const u = USERS.find(x => x.id === f.dataset.id); u.hash = await hashPw(u.usuario, fd.clave);
    saveUsers(); UI.resetUser = null; render(); toast(`Contraseña de ${u.usuario} actualizada`); return;
  }
  if (kind === 'note') { const d = S.deals.find(x => x.id === f.dataset.id); d.hist.push({ f: TODAY, t: fd.t }); d.actualizado = TODAY; commit('Nota agregada'); }
  if (kind === 'pnote') { logP(project(f.dataset.id), fd.t); commit('Novedad registrada'); }
  if (kind === 'newdeal') { const c = cityOf(fd.ciudad);
    const d = { id: uid('d'), cliente: fd.cliente, contacto: fd.contacto || '—', prov: c.prov, ciudad: c.ciudad, comuna: fd.comuna || '—', modelo: fd.modelo, canchas: +fd.canchas || 1,
      origen: fd.origen, etapa: 'nuevo', actualizado: TODAY, proyectoId: null, hist: [{ f: TODAY, t: 'Negocio ingresado a la bandeja.' }] };
    S.deals.push(d); UI.newDeal = false; UI.deal = d.id; UI.dealFilter = 'activos'; commit('Negocio agregado a la bandeja'); }
  if (kind === 'close') { const d = S.deals.find(x => x.id === f.dataset.id), c = cityOf(d.ciudad);
    const p = { id: uid('p'), dealId: d.id, nombre: fd.nombre, cliente: d.cliente, prov: c.prov, ciudad: c.ciudad, comuna: d.comuna, lat: c.lat, lon: c.lon,
      modelo: fd.modelo, canchas: d.canchas, diseno: {}, etapas: schedule(fd.fecha), traza: [] };
    p.etapas[0].estado = 'completada'; p.etapas[0].hecho = fd.fecha;
    d.hist.forEach(h => p.traza.push({ f: h.f, t: `[Bandeja] ${h.t}` }));
    p.traza.push({ f: fd.fecha, t: 'Venta cerrada. Proyecto creado desde la bandeja de negocios.' });
    d.etapa = 'cerrada'; d.actualizado = TODAY; d.proyectoId = p.id; d.hist.push({ f: TODAY, t: `Venta cerrada; pasa a Proyectos como «${fd.nombre}».` });
    S.projects.unshift(p); UI.closing = false; UI.view = 'proyectos'; UI.project = p.id; UI.projOpen = true; saveUI(); commit('Venta cerrada. Proyecto creado con su línea de tiempo'); window.scrollTo(0, 0); }
});

initUsers().then(render);
</script>
