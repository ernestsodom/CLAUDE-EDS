<title>Atila Gestión de Canchas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Saira:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: barra lateral de módulos + área de trabajo en paneles; la vista 3D de la cancha siempre en escena nocturna. */
:root {
  --bg: #0c1116; --surface: #131a21; --surface2: #1a232c; --line: #26323d;
  --fg: #e6ecf1; --muted: #8b98a4; --accent: #3d9bff; --accent-fg: #04121f;
  --lamp: #ffd27a; --ok: #3fbf7f; --warn: #e8a93a; --bad: #ef5a4f;
  --stage: #05080b;
  --f-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f2f4f6; --surface: #ffffff; --surface2: #eaeef2; --line: #d5dce3;
  --fg: #121a21; --muted: #5a6875; --accent: #1468c8; --accent-fg: #ffffff;
  --lamp: #a86e06; --ok: #1d8752; --warn: #a96d12; --bad: #c4372d; color-scheme: light } }
:root[data-theme="light"] {
  --bg: #f2f4f6; --surface: #ffffff; --surface2: #eaeef2; --line: #d5dce3;
  --fg: #121a21; --muted: #5a6875; --accent: #1468c8; --accent-fg: #ffffff;
  --lamp: #a86e06; --ok: #1d8752; --warn: #a96d12; --bad: #c4372d; color-scheme: light }

/* Línea gráfica ATILA (atilapadel.com): negro profundo, texto claro, acento menta, tipografía liviana en mayúsculas, bordes finos y esquinas rectas. */
:root[data-brand="atila"] {
  --bg: #0d0d0d; --surface: #141414; --surface2: #1d1d1d; --line: #2b2b2b;
  --fg: #f2f2f2; --muted: #a3a3a3; --accent: #41d7a7; --accent-fg: #0d0d0d;
  --lamp: #41d7a7; --ok: #41d7a7; --warn: #e9a23b; --bad: #e5564b; --r: 2px;
  --f-display: "Saira", "Arial Narrow", sans-serif; --f-body: "Saira", system-ui, sans-serif; color-scheme: dark }
@media (prefers-color-scheme: light) { :root[data-brand="atila"]:not([data-theme="dark"]) {
  --bg: #f4f4f3; --surface: #ffffff; --surface2: #ececea; --line: #d9d9d6;
  --fg: #0d0d0d; --muted: #5c5c5c; --accent: #14946c; --accent-fg: #ffffff; --lamp: #14946c; --ok: #14946c; --warn: #a86a0c; --bad: #c4372d; color-scheme: light } }
:root[data-brand="atila"][data-theme="light"] {
  --bg: #f4f4f3; --surface: #ffffff; --surface2: #ececea; --line: #d9d9d6;
  --fg: #0d0d0d; --muted: #5c5c5c; --accent: #14946c; --accent-fg: #ffffff; --lamp: #14946c; --ok: #14946c; --warn: #a86a0c; --bad: #c4372d; color-scheme: light }

* { box-sizing: border-box }
html, body { height: 100% }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.45 }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; letter-spacing: .01em; text-wrap: balance; margin: 0; line-height: 1.1 }
h1 { font-size: 30px } h2 { font-size: 22px } h3 { font-size: 17px; text-transform: uppercase; letter-spacing: .06em }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums }
.muted { color: var(--muted) }
.small { font-size: 12px }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600 }

.app { display: grid; grid-template-columns: 232px 1fr; min-height: 100% }
.side { background: var(--surface); border-right: 1px solid var(--line); padding-block: 18px; padding-inline: 14px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh }
.brand { display: flex; align-items: center; gap: 10px }
.brand svg { flex: none }
.brand b { font-family: var(--f-display); font-size: 21px; letter-spacing: .04em; text-transform: uppercase; display: block; line-height: 1 }
.brand span { font-size: 11px; color: var(--muted) }
.profiles { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface2); border-radius: 8px; padding: 3px; gap: 3px }
.profiles button { border: 0; background: transparent; padding: 7px 4px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--muted) }
.profiles button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg) }
.nav { display: flex; flex-direction: column; gap: 2px }
.nav button { display: flex; align-items: center; gap: 10px; border: 0; background: transparent; padding: 9px 10px; border-radius: 7px; text-align: left; color: var(--muted); font-weight: 500 }
.nav button:hover { background: var(--surface2); color: var(--fg) }
.nav button svg { flex: none }
.nav button[aria-current="page"] { background: var(--surface2); color: var(--fg); box-shadow: inset 2px 0 0 var(--accent) }
.nav .count { margin-left: auto; font-family: var(--f-mono); font-size: 11px; background: var(--line); color: var(--fg); border-radius: 10px; padding: 0 7px }
.side-foot { margin-top: auto; font-size: 11px; color: var(--muted); display: grid; gap: 8px }
.side-foot button { justify-self: start }

.main { min-width: 0; padding-block: 22px 40px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap }
.head p { margin: 4px 0 0; color: var(--muted); max-width: 70ch }

.btn { border: 1px solid var(--line); background: var(--surface2); padding: 7px 12px; border-radius: 7px; font-weight: 500; font-size: 13px }
.btn:hover { border-color: var(--muted) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600 }
.btn.ghost { background: transparent }
.btn.sm { padding: 4px 9px; font-size: 12px }
.btn.danger { color: var(--bad) }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0 }
.panel > .ph { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap }
.panel > .pb { padding: 16px }
.split { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 16px; align-items: start }
.split > * { min-width: 0 }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; border: 1px solid currentColor; white-space: nowrap; line-height: 1.5 }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor }
.st-ok { color: var(--ok) } .st-warn { color: var(--warn) } .st-bad { color: var(--bad) } .st-acc { color: var(--accent) } .st-mut { color: var(--muted) }

/* Bandeja */
.tabs { display: flex; gap: 4px; flex-wrap: wrap }
.tabs button { border: 1px solid var(--line); background: transparent; border-radius: 20px; padding: 4px 11px; font-size: 12px; color: var(--muted) }
.tabs button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg) }
.inbox { list-style: none; margin: 0; padding: 0 }
.inbox li button { width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 12px 16px; display: grid; grid-template-columns: 1fr auto; gap: 3px 10px }
.inbox li button:hover { background: var(--surface2) }
.inbox li button[aria-current="true"] { background: var(--surface2); box-shadow: inset 3px 0 0 var(--accent) }
.inbox .t { font-weight: 600 }
.inbox .s { color: var(--muted); font-size: 12px; grid-column: 1 / -1 }
.funnel { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: var(--line); border-radius: 8px; overflow: hidden; border: 1px solid var(--line) }
.funnel div { background: var(--surface); padding: 10px 12px }
.funnel b { font-family: var(--f-display); font-size: 26px; display: block; line-height: 1 }
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; margin: 0 }
.kv dt { color: var(--muted) } .kv dd { margin: 0 }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 0 }
.log li { display: grid; grid-template-columns: 78px 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 13px }
.log li:last-child { border-bottom: 0 }
.log .d { color: var(--muted); font-family: var(--f-mono); font-size: 12px }
.closebox { border: 1px solid var(--accent); border-radius: 10px; padding: 14px; display: grid; gap: 10px; background: color-mix(in srgb, var(--accent) 7%, transparent) }

.form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px }
.form .full { grid-column: 1 / -1 }
.field { display: grid; gap: 4px; min-width: 0 }
.field > span { font-size: 12px; color: var(--muted); font-weight: 500 }
input[type=text], input[type=password], input[type=email], input[type=tel], input[type=date], input[type=number], select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; width: 100%; min-width: 0 }
textarea { resize: vertical; min-height: 60px }
.check { display: flex; align-items: center; gap: 8px }

/* Proyectos */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px }
.tipos { display: grid; gap: 6px }
.tipo { display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left; border: 1px solid var(--line); background: var(--bg); padding: 10px 12px; border-radius: var(--r, 7px) }
.tipo[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent) }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px }
.kpi b { font-family: var(--f-display); font-size: 28px; line-height: 1 }
.plist { display: grid; gap: 8px }
.pcard { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px }
.pcard:hover { border-color: var(--muted) }
.pcard[aria-current="true"] { border-color: var(--accent) }
.pcard .top { display: flex; justify-content: space-between; gap: 8px; align-items: start }
.pcard .t { font-weight: 600 }
.bar { height: 5px; background: var(--surface2); border-radius: 3px; overflow: hidden; display: flex; gap: 2px }
.bar i { flex: 1; background: var(--line) }
.bar i.done { background: var(--ok) } .bar i.cur { background: var(--accent) } .bar i.late { background: var(--bad) }

.gantt { display: grid; gap: 6px; overflow-x: auto }
.grow { display: grid; grid-template-columns: 170px 1fr; gap: 10px; align-items: center; min-width: 560px }
.gtrack { position: relative; height: 26px; background: var(--surface2); border-radius: 5px }
.gbar { position: absolute; top: 4px; bottom: 4px; border-radius: 4px; min-width: 8px; background: var(--line); display: flex; align-items: center; padding: 0 6px; font-size: 11px; font-family: var(--f-mono); white-space: nowrap; overflow: hidden; color: var(--fg) }
.gbar.done { background: color-mix(in srgb, var(--ok) 55%, var(--surface2)) }
.gbar.cur { background: var(--accent); color: var(--accent-fg) }
.gbar.late { background: var(--bad); color: #fff }
.gtoday { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--lamp); z-index: 2 }
.gaxis { display: grid; grid-template-columns: 170px 1fr; gap: 10px; min-width: 560px }
.gaxis div { position: relative; height: 16px; font-size: 11px; color: var(--muted); font-family: var(--f-mono) }
.gaxis > div span { position: absolute; transform: translateX(-50%); white-space: nowrap }

.stages { list-style: none; margin: 0; padding: 0; display: grid }
.stages li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line) }
.stages li:last-child { border-bottom: 0 }
.dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 11px; font-weight: 700; font-family: var(--f-mono) }
.dot.done { background: var(--ok); border-color: var(--ok); color: #fff }
.dot.cur { border-color: var(--accent); color: var(--accent) }
.dot.late { border-color: var(--bad); color: var(--bad) }
.dates { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 4px }
.dates input { width: auto; padding: 3px 6px; font-size: 12px }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 16px }
.two > * { min-width: 0 }

/* Escena 3D */
.scene { background: var(--stage); border-radius: 10px; overflow: hidden; border: 1px solid var(--line) }
.scene { position: relative }
.scene canvas { display: block; width: 100%; height: auto; aspect-ratio: 1200 / 840; max-width: 100% }
.scene-label { position: absolute; left: 14px; bottom: 10px; font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: #9aa6b1 }

/* Calendario */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden }
.cal .dh { background: var(--surface2); padding: 6px 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600 }
.cal .dc { background: var(--surface); min-height: 104px; padding: 6px; display: flex; flex-direction: column; gap: 3px; min-width: 0 }
.cal .dc.out { background: var(--bg) }
.cal .dc.today { box-shadow: inset 0 0 0 2px var(--lamp) }
.cal .n { font-family: var(--f-mono); font-size: 12px; color: var(--muted) }
.ev { border: 0; text-align: left; font-size: 11px; padding: 2px 5px; border-radius: 4px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; width: 100% }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted) }
.legend span { display: inline-flex; align-items: center; gap: 6px }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block }

/* Mapa */
.agenda { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start }
.agenda > * { min-width: 0 }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 12px }
.pcard .top { align-items: center }
.map { position: relative; overflow: hidden }
.map svg { width: 100%; height: 620px; display: block; touch-action: none; cursor: grab; user-select: none }
.map svg:active { cursor: grabbing }
.mapctl { position: absolute; top: 10px; right: 10px; display: flex; gap: 4px; align-items: center; z-index: 2; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px }
.mapctl .btn.sm { min-width: 28px }
.maphint { padding: 8px 12px; border-top: 1px solid var(--line) }
.land.uru { opacity: .6 }
.country { font: 600 6px var(--f-body); letter-spacing: .1em; fill: var(--muted); text-anchor: middle; pointer-events: none }
.land { fill: var(--surface2); stroke: var(--muted); stroke-width: 1; vector-effect: non-scaling-stroke }
.city circle { fill: var(--muted); opacity: .6 }
.city text { display: none; font: 400 7px var(--f-body); fill: var(--muted) }
svg.zoomed2 .city text { display: inline }
svg .city.has text { display: none }
.mlabel { display: none; font: 600 10px var(--f-body); fill: var(--fg); stroke: var(--surface); stroke-width: 4px; paint-order: stroke; pointer-events: none }
.mlabel.sub { font-weight: 500; font-size: 8px; fill: var(--muted) }
svg.zoomed .mlabel, .mk.sel .mlabel { display: inline }
.mk { cursor: pointer }
.mk circle.halo { opacity: .25 }
.mk.sel circle.core { stroke: var(--fg); stroke-width: 2 }
.maplist { display: grid; gap: 0 }
.maplist button { border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; padding: 10px 14px; display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: center }
.maplist button:hover, .maplist button[aria-current="true"] { background: var(--surface2) }
.sw { width: 10px; height: 10px; border-radius: 50% }

/* Configurador */
.cfg { display: grid; grid-template-columns: 330px 1fr; gap: 16px; align-items: start }
.cfg > * { min-width: 0 }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; align-items: center }
.swatches button { width: 26px; height: 26px; border-radius: 6px; border: 2px solid var(--line); padding: 0 }
.swatches button[aria-pressed="true"] { border-color: var(--fg) }
.swatches input[type=color] { width: 34px; height: 28px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); padding: 2px }
.typebadge { font-family: var(--f-display); font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--lamp) }
.disabled { opacity: .45; pointer-events: none }
.logo-prev { width: 90px; height: 46px; background: var(--bg); border: 1px dashed var(--line); border-radius: 6px; display: grid; place-items: center; overflow: hidden }
.logo-prev img { max-width: 100%; max-height: 100% }

table.models { width: 100%; border-collapse: collapse }
table.models th, table.models td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle }
table.models th { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600 }
.tablewrap { overflow-x: auto }

.empty { padding: 40px 20px; text-align: center; color: var(--muted); display: grid; gap: 8px; justify-items: center }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 8px; font-weight: 500; z-index: 20; box-shadow: 0 6px 20px rgb(0 0 0 / .3) }

@media (max-width: 1100px) {
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)) }
  .funnel { grid-template-columns: repeat(3, 1fr) }
  .cfg, .agenda { grid-template-columns: 1fr }
}
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr) }
  .side { min-width: 0 }
  .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); gap: 12px }
  .nav { flex-direction: row; overflow-x: auto }
  .nav button { white-space: nowrap }
  .side-foot { display: none }
  .main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
  .split, .two { grid-template-columns: 1fr }
  .form { grid-template-columns: 1fr }
  .kv { grid-template-columns: 110px 1fr }
  .cal .dc { min-height: 70px }
  .map svg { height: 440px }
  .cal .ev { font-size: 0; height: 6px; padding: 0 }
}
@media (prefers-reduced-motion: no-preference) { .gbar, .pcard, .nav button { transition: background .15s, border-color .15s } }

/* Marca en la barra lateral */
.logo { display: none; width: 150px; height: auto }
:root[data-brand="atila"] .brand > svg, :root[data-brand="atila"] #brandName { display: none }
:root[data-brand="atila"] .brand { flex-direction: column; align-items: flex-start; gap: 8px }
:root[data-brand="atila"] .logo-claro { display: block }
@media (prefers-color-scheme: light) { :root[data-brand="atila"]:not([data-theme="dark"]) .logo-claro { display: none }
  :root[data-brand="atila"]:not([data-theme="dark"]) .logo-oscuro { display: block } }
:root[data-brand="atila"][data-theme="light"] .logo-claro { display: none }
:root[data-brand="atila"][data-theme="light"] .logo-oscuro { display: block }
:root[data-brand="atila"] .brand span { letter-spacing: .1em; text-transform: uppercase; font-size: 9.5px }

/* Componentes con la línea ATILA */
:root[data-brand="atila"] body { font-weight: 300 }
:root[data-brand="atila"] h1 { font-weight: 300; font-size: 36px; text-transform: uppercase; letter-spacing: -.02em }
:root[data-brand="atila"] h1 em, :root[data-brand="atila"] h2 em { font-style: normal; color: var(--accent) }
:root[data-brand="atila"] h2 { font-weight: 400; text-transform: uppercase; letter-spacing: -.01em }
:root[data-brand="atila"] h3 { font-weight: 400; letter-spacing: .14em; font-size: 14px }
:root[data-brand="atila"] b, :root[data-brand="atila"] strong, :root[data-brand="atila"] .t { font-weight: 500 }
:root[data-brand="atila"] .label { color: var(--accent); letter-spacing: .22em; font-weight: 400 }
:root[data-brand="atila"] .panel, :root[data-brand="atila"] .kpi, :root[data-brand="atila"] .pcard, :root[data-brand="atila"] .scene,
:root[data-brand="atila"] .cal, :root[data-brand="atila"] .funnel, :root[data-brand="atila"] .closebox { border-radius: var(--r) }
:root[data-brand="atila"] .btn { border-radius: var(--r); text-transform: uppercase; letter-spacing: .06em; font-weight: 400; font-size: 12px }
:root[data-brand="atila"] .btn.primary { font-weight: 500 }
:root[data-brand="atila"] .btn.ghost { border-color: var(--accent); color: var(--accent) }
:root[data-brand="atila"] .profiles, :root[data-brand="atila"] .profiles button, :root[data-brand="atila"] .nav button,
:root[data-brand="atila"] input, :root[data-brand="atila"] select, :root[data-brand="atila"] .tabs button, :root[data-brand="atila"] .pill { border-radius: var(--r) }
:root[data-brand="atila"] .nav button { text-transform: uppercase; letter-spacing: .04em; font-size: 11.5px; font-weight: 400; white-space: nowrap }
:root[data-brand="atila"] .nav button[aria-current="page"] { color: var(--accent) }
:root[data-brand="atila"] .kpi b { font-weight: 300; font-size: 34px }
:root[data-brand="atila"] .typebadge { color: var(--accent); font-family: var(--f-body); font-weight: 400; letter-spacing: .14em }

/* Tarjetas de proyecto: todo el contenido toma el color de su estado */
.st-card { --c: #3a3f44; --t: #f2f2f2; background: var(--c); color: var(--t); border-color: transparent }
.st-card:hover { border-color: var(--fg) }
.st-card .muted { color: inherit; opacity: .78 }
.st-card .bar { background: transparent }
.st-card .bar i { background: currentColor; opacity: .22 }
.st-card .bar i.done { opacity: .95 } .st-card .bar i.cur { opacity: .6 } .st-card .bar i.late { opacity: .6 }
.st-card .pill { color: inherit }
.cardlegend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted) }
.cardlegend span { display: inline-flex; gap: 6px; align-items: center }
.cardlegend i { width: 14px; height: 14px; border-radius: var(--r, 3px); display: inline-block }

/* Ingreso y usuarios */
[hidden] { display: none !important }
h1 em, h2 em { font-style: normal; color: var(--accent) }
body.no-session .side { display: none }
body.no-session .app { grid-template-columns: minmax(0, 1fr) }
.login { min-height: 80vh; display: grid; place-items: center }
.login-card { width: min(400px, 100%) }
.userbox { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px }
table.users td { vertical-align: top }

/* Amortiguadores y archivos */
.amortwrap { display: grid; grid-template-columns: minmax(240px, 380px) 1fr; gap: 20px }
.amortwrap > * { min-width: 0 }
.amortbox { border-radius: var(--r, 8px); border: 1px solid var(--line); overflow: hidden; background: #000 }
.amortbox canvas { display: block; width: 100%; height: auto; aspect-ratio: 1 }
.ralsel { display: flex; gap: 10px; align-items: center }
.ralsel i { width: 40px; height: 40px; border-radius: var(--r, 6px); border: 1px solid var(--line); flex: none }
.ralgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 5px; max-height: 420px; overflow-y: auto; padding: 2px }
.ralsw { aspect-ratio: 1; border: 2px solid transparent; border-radius: var(--r, 5px); padding: 0; display: flex; align-items: flex-end; justify-content: center; position: relative }
.ralsw span { font: 500 9px var(--f-mono); background: rgb(0 0 0 / .45); color: #fff; padding: 0 3px; margin-bottom: 3px; border-radius: 2px }
.ralsw[aria-pressed="true"] { border-color: var(--fg); box-shadow: 0 0 0 2px var(--accent) }
.filebox { display: flex; gap: 10px; align-items: center; padding: 8px; border: 1px dashed var(--line); border-radius: var(--r, 6px) }
.filebox img { width: 96px; height: 64px; object-fit: contain; background: var(--bg) }
.fileic { width: 56px; height: 64px; display: grid; place-items: center; background: var(--surface2); font: 600 12px var(--f-mono); border-radius: var(--r, 4px) }
@media (max-width: 860px) { .amortwrap { grid-template-columns: 1fr } }

/* Visor 3D */
.v3d { position: relative; background: #0d0d0d; border: 1px solid var(--line); border-radius: var(--r, 8px); overflow: hidden; min-height: 120px; touch-action: none }
.v3d canvas { display: block; width: 100%; cursor: grab }
.v3d canvas:active { cursor: grabbing }
.v3d-hint { position: absolute; left: 10px; bottom: 8px; font-size: 11px; color: #a3a3a3; pointer-events: none; background: rgb(0 0 0 / .45); padding: 2px 6px; border-radius: 3px }
.v3d.small .v3d-hint { font-size: 10px }
.v3d.small { width: 100% }
.deal-cancha > div:first-child { max-width: 560px }
.v3d-off { display: grid; place-items: center; padding: 30px; color: #a3a3a3; text-align: center }
/* Diseñador compacto */
.designer { display: grid; grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr); gap: 18px; align-items: start }
.designer > * { min-width: 0 }
.dz-side { display: grid; gap: 14px }
.seg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px }
.seg button { border: 1px solid var(--line); background: var(--bg); padding: 7px 6px; border-radius: var(--r, 6px); font-size: 12px; text-align: left; display: grid; gap: 1px; line-height: 1.2 }
.seg button span { font-size: 10px; color: var(--muted) }
.seg button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent) }
.dot-c { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: -1px; border: 1px solid rgb(127 127 127 / .5) }
.pal { display: flex; gap: 10px; align-items: flex-start; margin-top: 8px }
.chips { display: flex; flex-wrap: wrap; gap: 5px; align-items: center }
.chip { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); padding: 0 }
.chip[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent) }
.chips input[type=color] { width: 30px; height: 26px; padding: 1px; border: 1px solid var(--line); border-radius: var(--r, 6px); background: var(--bg) }
.amort-mini { width: 92px; height: 92px; flex: none; border-radius: var(--r, 6px); border: 1px solid var(--line) }
a.btn { text-decoration: none; color: inherit; display: inline-flex; align-items: center }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.sw-i { width: 12px; height: 12px; display: inline-block; border-radius: 3px; margin-right: 6px; vertical-align: -1px; border: 1px solid rgb(127 127 127 / .5) }
.tag { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; border: 1px solid var(--line); padding: 1px 6px; border-radius: 3px; color: var(--muted); font-weight: 500 }
.count.hot { background: var(--accent); color: var(--accent-fg) }
.deal-cancha { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-items: start }
/* Cotizaciones */
.qrow { border: 1px solid var(--line); border-radius: var(--r, 8px); overflow: hidden }
.qhead { width: 100%; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: var(--surface2); border: 0; padding: 9px 12px; text-align: left }
.qdoc { background: #fff; color: #161616; padding: 22px; display: grid; gap: 14px; font-size: 13px }
.qdoc .label { color: #14946c }
.qdoc header { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid #161616; padding-bottom: 10px }
.qlogo { width: 130px; height: auto; display: block }
.qcli { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
.qcli .label, .qspec .label { display: block; margin-bottom: 2px }
.qspec ul { margin: 4px 0 0; padding-left: 18px }
.qtable { width: 100%; border-collapse: collapse }
.qtable th, .qtable td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #ddd }
.qtable th:not(:first-child), .qtable td:not(:first-child) { text-align: right }
.qtable tfoot td { font-weight: 700; border-top: 2px solid #161616; border-bottom: 0 }
.qsend { display: grid; gap: 8px; padding: 12px }
.qitems input { min-width: 0 }
@media (max-width: 1100px) { .designer, .deal-cancha { grid-template-columns: 1fr } }
@media (max-width: 600px) { .qcli { grid-template-columns: 1fr } .seg { grid-template-columns: 1fr } }

/* Etapas de la entrega: cada etapa se pinta con su color al avanzar */
.stages li.stg { padding-left: 10px; padding-right: 10px; border-radius: var(--r, 6px); border-left: 3px solid transparent; margin-bottom: 4px }
.stages li.stg.done { background: color-mix(in srgb, var(--sc) 22%, transparent); border-left-color: var(--sc) }
.stages li.stg.cur { background: color-mix(in srgb, var(--sc) 9%, transparent); border-left-color: color-mix(in srgb, var(--sc) 60%, transparent) }
.stages li.stg.late { background: color-mix(in srgb, var(--bad) 12%, transparent); border-left-color: var(--bad) }
.stages li.stg .dot.done { background: var(--sc); border-color: var(--sc); color: #0d0d0d }
.stages li.stg .dot.cur { border-color: var(--sc); color: var(--sc) }
.stages li.stg.cur .btn.primary { background: var(--sc); border-color: var(--sc); color: #0d0d0d }
</style>

// El cronograma indica solo el mes de producción y el de logística + instalación; los días se estiman así:
// producción = todo el mes; salida y transporte = días 1–5 del mes siguiente; entrega = día 6; instalación = días 7–20; habilitada = día 21.
function scheduleFromMonths(prod, log) {
  const end = ym => { const [y, m] = ym.split('-').map(Number); return isoOf(new Date(y, m, 0)); };
  const d = (ym, day) => `${ym}-${pad(day)}`;
  const s = { venta: [addDays(d(prod, 1), -1), addDays(d(prod, 1), -1)], construccion: [d(prod, 1), end(prod)], salida: [d(log, 1), d(log, 5)],
    entrega: [d(log, 6), d(log, 6)], instalacion: [d(log, 7), d(log, 20)], habilitada: [d(log, 21), d(log, 21)] };
  return STAGES.map(st => ({ key: st.key, inicio: s[st.key][0], fin: s[st.key][1], estado: 'pendiente', hecho: '' }));
}

function createCourt3D(el, dz, opts) {
  // Réplica de los renders ATILA: x = ancho (10 m), z = largo (20 m), y = alto. Cámara por defecto en la esquina (-x, +z) como en las imágenes.
  const T = THREE;
  const renderer = new T.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
  el.prepend(renderer.domElement);

  const camera = new T.PerspectiveCamera(42, 1.6, 0.5, 200);

  const mats = {
    grass: new T.MeshLambertMaterial({ color: dz.pasto }),
    poles: new T.MeshStandardMaterial({ color: dz.postes || POSTES_DEF, roughness: 0.5, metalness: 0.3 }),
    amort: new T.MeshStandardMaterial({ color: (dz.amort || AMORT_DEF).hex, roughness: 0.5, metalness: 0.1 }),
    steel: new T.MeshStandardMaterial({ color: '#202020', roughness: 0.6, metalness: 0.4 }),
    white: new T.MeshStandardMaterial({ color: '#f2f2f2', roughness: 0.5 }),
    glass: new T.MeshStandardMaterial({ color: '#d6efe6', transparent: true, opacity: 0.1, roughness: 0.05, side: T.DoubleSide, depthWrite: false }),
    seam: new T.MeshBasicMaterial({ color: '#9fb3ad', transparent: true, opacity: 0.55 }),
    line: new T.MeshBasicMaterial({ color: '#ffffff' }),
    led: new T.MeshBasicMaterial({ color: '#ffffff' }),
    spring: new T.MeshStandardMaterial({ color: '#111111', roughness: 0.4, metalness: 0.7 })

  const root = new T.Group(); scene.add(root);
  let built = null;
  const box = (w, h, d, m, x, y, z, p) => { const o = new T.Mesh(new T.BoxGeometry(w, h, d), m); o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; (p || built).add(o); return o; };
  const plane = (w, h, m, x, y, z, ry, p) => { const o = new T.Mesh(new T.PlaneGeometry(w, h), m); o.position.set(x, y, z); o.rotation.y = ry || 0; (p || built).add(o); return o; };
  const vbar = (x, z, y0, y1, w, m) => box(w, y1 - y0, w, m, x, (y0 + y1) / 2, z);
  // tramo de pared entre (x0,z0) y (x1,z1)
  const seg = (x0, z0, x1, z1, fn) => { const len = Math.hypot(x1 - x0, z1 - z0), cx = (x0 + x1) / 2, cz = (z0 + z1) / 2, ry = x0 === x1 ? Math.PI / 2 : 0; fn(len, cx, cz, ry); };
  const lineMat = new T.LineBasicMaterial({ color: '#4d4d4d', transparent: true, opacity: 0.4 });

    const len = Math.hypot(x1 - x0, z1 - z0), pts = [], ux = (x1 - x0) / len, uz = (z1 - z0) / len;
    for (let t = 0; t <= len + 1e-6; t += cell) { const x = x0 + ux * t, z = z0 + uz * t; pts.push(x, y0, z, x, y1, z); }
    for (let y = y0; y <= y1 + 1e-6; y += cell) pts.push(x0, y, z0, x1, y, z1);
    const g = new T.BufferGeometry(); g.setAttribute('position', new T.Float32BufferAttribute(pts, 3)); built.add(new T.LineSegments(g, lineMat));
  };

    // reja superior de 1 m solo sobre los fondos y el vértice (2 m del lateral); puerta de acceso en cada lateral.
    const semi = model(d.modelo).tipo === 'semi', H = 3, UP = 4;
    const floor = new T.Mesh(new T.PlaneGeometry(10, 20), mats.grass); floor.rotation.x = -Math.PI / 2; floor.position.y = 0.012; floor.receiveShadow = true; built.add(floor);
    [-6.95, 6.95].forEach(z => box(10, 0.006, 0.05, mats.line, 0, 0.018, z));
    box(0.05, 0.006, 13.9, mats.line, 0, 0.018, 0);

let USERS = [];
async function hashPw(usuario, pw) {
  const txt = 'atila-maqueta|' + usuario.trim().toLowerCase() + '|' + pw;
  if (window.crypto && crypto.subtle) {
    const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
    return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join('');
  }
  let h = 2166136261; for (const ch of txt) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; } return 'f' + h.toString(16);
}
const saveUsers = () => { try { localStorage.setItem(UKEY, JSON.stringify(USERS)); } catch (e) {} };
async function initUsers() {
  try { USERS = JSON.parse(localStorage.getItem(UKEY)) || []; } catch (e) { USERS = []; }
  if (!USERS.length) {
    const base = [['admin', 'Super administrador', 'Admin2026!', 'superadmin', ['atila', 'europa']],
      ['atila', 'Equipo Atila', 'Atila2026!', 'usuario', ['atila']], ['europa', 'Equipo Europa', 'Europa2026!', 'usuario', ['europa']]];

function cardState(p) {
  const c = current(p);

  if (c.estado === 'pendiente' || c.key === 'venta') return 'espera';

}

function gantt(p) {
  let a = p.etapas[0].inicio, b = p.etapas[p.etapas.length - 1].fin;
  if (TODAY < a) a = TODAY; if (TODAY > b) b = TODAY;
  a = addDays(a, -2); b = addDays(b, 3);
  const span = diffDays(a, b) + 1, pct = iso => (diffDays(a, iso) / span * 100);
  const ticks = []; for (let i = 0; i <= span; i += Math.max(7, Math.round(span / 6))) ticks.push(addDays(a, i));
  const todayL = pct(TODAY) + (0.5 / span * 100);
  return `<div class="gantt">
    ${p.etapas.map(e => { const cls = e.estado === 'completada' ? 'done' : isLate(e) ? 'late' : e.estado === 'en_curso' ? 'cur' : '';
      const w = Math.max((diffDays(e.inicio, e.fin) + 1) / span * 100, 1.2);
      return `<div class="grow"><span class="small">${stageName(e.key)}</span><div class="gtrack"><div class="gtoday" style="left:${todayL}%"></div>
        <div class="gbar ${cls}" style="left:${pct(e.inicio)}%;width:${w}%" title="${fmtY(e.inicio)} → ${fmtY(e.fin)}">${w > 16 ? fmt(e.inicio) + ' – ' + fmt(e.fin) : ''}</div></div></div>`; }).join('')}
    <div class="gaxis"><i></i><div>${ticks.map(t => `<span style="left:${pct(t)}%">${fmt(t)}</span>`).join('')}</div></div>
  </div>`;
}

/* ---------- Mapa con zoom ---------- */
const MAPW = 215, MAPH = 425, ZMAX = 60;
UI.map = { z: 1, cx: MAPW / 2, cy: MAPH / 2 };
const mapVB = () => { const { z, cx, cy } = UI.map, w = MAPW / z, h = MAPH / z; return [cx - w / 2, cy - h / 2, w, h]; };
function mapClamp() {
  const m = UI.map; m.z = Math.min(ZMAX, Math.max(1, m.z));
  m.cx = Math.min(MAPW, Math.max(0, m.cx)); m.cy = Math.min(MAPH, Math.max(0, m.cy));
  if (m.z === 1) { m.cx = MAPW / 2; m.cy = MAPH / 2; }
}
function applyMap() {
  const svg = $('#agmap'); if (!svg) return;
  mapClamp();
  svg.setAttribute('viewBox', mapVB().map(v => v.toFixed(3)).join(' '));
  const s = (1 / UI.map.z).toFixed(4);
  svg.querySelectorAll('[data-x]').forEach(g => g.setAttribute('transform', `translate(${g.dataset.x} ${g.dataset.y}) scale(${s})`));
  svg.classList.toggle('zoomed', UI.map.z >= 2.5);
  svg.classList.toggle('zoomed2', UI.map.z >= 5);
  const zl = $('#mapzl'); if (zl) zl.textContent = `${UI.map.z < 10 ? UI.map.z.toFixed(1) : Math.round(UI.map.z)}×`;
}
function mapZoomAt(px, py, f) {
  const m = UI.map, nz = Math.min(ZMAX, Math.max(1, m.z * f));
  m.cx = px - (px - m.cx) * (m.z / nz); m.cy = py - (py - m.cy) * (m.z / nz); m.z = nz; applyMap();
}
function mapFocus(p) { if (!p) return; UI.map.cx = MX(p.lon); UI.map.cy = MY(p.lat); UI.map.z = Math.max(UI.map.z, 12); }
function setupMap() {
  const svg = $('#agmap'); if (!svg) return;
  applyMap();
  const toSvg = (x, y) => { const pt = svg.createSVGPoint(); pt.x = x; pt.y = y; return pt.matrixTransform(svg.getScreenCTM().inverse()); };
  const ptrs = new Map(); let start = null, moved = false, pinch = null;
  svg.addEventListener('wheel', e => { e.preventDefault(); const p = toSvg(e.clientX, e.clientY); mapZoomAt(p.x, p.y, e.deltaY < 0 ? 1.25 : 0.8); }, { passive: false });
  svg.addEventListener('dblclick', e => { e.preventDefault(); const p = toSvg(e.clientX, e.clientY); mapZoomAt(p.x, p.y, 2); });
  svg.addEventListener('pointerdown', e => {
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = false;
    if (ptrs.size === 1) start = { x: e.clientX, y: e.clientY, cx: UI.map.cx, cy: UI.map.cy, p: toSvg(e.clientX, e.clientY) };
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: UI.map.z }; }
  });
  svg.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 2 && pinch) {
      const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y), mid = toSvg((a.x + b.x) / 2, (a.y + b.y) / 2);
      mapZoomAt(mid.x, mid.y, (pinch.z * d / pinch.d) / UI.map.z); moved = true; return;
    }
    if (!start) return;
    if (!moved && Math.hypot(e.clientX - start.x, e.clientY - start.y) < 4) return;
    if (!moved) { moved = true; svg.setPointerCapture(e.pointerId); }
    const cur = toSvg(e.clientX, e.clientY);
    UI.map.cx -= cur.x - start.p.x; UI.map.cy -= cur.y - start.p.y; applyMap();
  });
  const end = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; if (!ptrs.size) start = null; };
  svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
  svg.addEventListener('click', e => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
}

/* ---------- Calendario y mapa ---------- */
function vAgenda() {
  const inProv = S.projects.filter(p => !UI.mapProv || p.prov === UI.mapProv);
  const shown = inProv.filter(p => !UI.calProject || p.id === UI.calProject);
  const sel = project(UI.calProject);
  const colorOf = p => { const st = pStatus(p); return st.key === 'fin' ? '#2ea86a' : stageColor(st.key); };

  // Mapa: todos los proyectos del filtro, con su nombre y cantidad de canchas (visibles al hacer zoom)
  const seen = {};
  const markers = inProv.map(p => { const k = p.lat.toFixed(3) + p.lon.toFixed(3), n = seen[k] = (seen[k] || 0) + 1;
    const st = pStatus(p), on = UI.calProject === p.id, short = p.nombre.split(' — ')[0];
    return `<g class="mk ${on ? 'sel' : ''}" data-act="mapsel" data-id="${p.id}" data-x="${MX(p.lon).toFixed(2)}" data-y="${MY(p.lat).toFixed(2)}"><title>${esc(p.nombre)} — ${p.canchas} cancha${p.canchas === 1 ? '' : 's'} — ${esc(st.txt)}</title>
      <g transform="translate(0 ${(n - 1) * 34})"><circle class="halo" r="${on ? 11 : 8}" fill="${colorOf(p)}"/>
      <circle class="core" r="4.5" fill="${colorOf(p)}" ${st.cls === 'st-bad' ? 'stroke="var(--bad)" stroke-width="2"' : ''}/>
      <text class="mlabel" x="10" y="-1">${esc(short)}</text>
      <text class="mlabel sub" x="10" y="10">${p.canchas} cancha${p.canchas === 1 ? '' : 's'} · ${esc(model(p.modelo).nombre)}</text>
      <text class="mlabel sub" x="10" y="19" style="fill:${colorOf(p)}">${esc(st.txt)}</text></g></g>`; }).join('');
  const cityDots = CITIES.map(c => `<g class="city ${inProv.some(p => p.ciudad === c.ciudad) ? 'has' : ''}" data-x="${MX(c.lon).toFixed(2)}" data-y="${MY(c.lat).toFixed(2)}"><circle r="1.8"/><text x="4" y="3">${esc(c.ciudad)}</text></g>`).join('');

  // Calendario
  const [y, mo] = UI.cal.split('-').map(Number);
  const first = new Date(y, mo - 1, 1), start = new Date(first); start.setDate(1 - ((first.getDay() + 6) % 7));
  const events = {};
  const push = (iso, ev) => (events[iso] = events[iso] || []).push(ev);
  shown.forEach(p => p.etapas.forEach(e => {
    const short = p.nombre.split(' — ')[0];
    if (e.inicio === e.fin) push(e.inicio, { p, e, t: `${stageName(e.key)} · ${short}` });
    else { push(e.inicio, { p, e, t: `▶ ${stageName(e.key)} · ${short}` }); push(e.fin, { p, e, t: `■ Fin ${stageName(e.key).toLowerCase()} · ${short}` }); }
  }));
  const cells = [];
  for (let i = 0; i < 42; i++) { const d = new Date(start); d.setDate(start.getDate() + i); cells.push(d); if (i >= 34 && d.getMonth() !== mo - 1 && d.getDay() === 0) break; }

  return `<div class="head"><div><h1>Calendario y <em>mapa</em></h1><p>Dónde y cuándo: todos los proyectos en el mapa de Argentina y sus hitos de entrega en el calendario. Haz zoom en el mapa para leer cada proyecto con su cantidad de canchas.</p></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <select id="ag-prov" data-field="mapProv" aria-label="Filtrar por provincia" style="width:auto"><option value="">Todas las provincias / países</option>${PROVINCIAS.map(p => `<option ${UI.mapProv === p ? 'selected' : ''}>${esc(p)}</option>`).join('')}</select>
      <select id="ag-proj" data-field="calProject" aria-label="Filtrar por proyecto" style="width:auto"><option value="">Todos los proyectos</option>${inProv.map(p => `<option value="${p.id}" ${UI.calProject === p.id ? 'selected' : ''}>${esc(p.nombre)}</option>`).join('')}</select>
    </div></div>
  <div class="legend">${STAGES.map(s => `<span><i style="background:${s.color}"></i>${s.nombre}</span>`).join('')}</div>
  <div class="agenda">
    <div style="display:grid;gap:12px;min-width:0;align-content:start">
      <div class="panel map"><div class="mapctl" role="group" aria-label="Zoom del mapa">
          <button class="btn sm" data-act="mapzoom" data-id="in" aria-label="Acercar">+</button>
          <button class="btn sm" data-act="mapzoom" data-id="out" aria-label="Alejar">−</button>
          <button class="btn sm" data-act="mapzoom" data-id="all">Ver todo</button>
          <span class="mono small muted" id="mapzl">1.0×</span></div>
        <svg id="agmap" viewBox="0 0 ${MAPW} ${MAPH}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Mapa de Argentina con proyectos">
          <polygon class="land" points="${mpts(AR)}"/><polygon class="land" points="${mpts(TDF)}"/><polygon class="land uru" points="${mpts(URU)}"/><text class="country" x="${MX(-56).toFixed(1)}" y="${MY(-32.4).toFixed(1)}">URUGUAY</text>${cityDots}${markers}</svg>
        <div class="maphint small muted">Rueda del mouse, doble clic o pellizco para hacer zoom · arrastra para moverte · mapa esquemático</div></div>
      ${sel ? `<div class="panel"><div class="ph"><div><b>${esc(sel.nombre)}</b><br><span class="muted small">${esc(sel.ciudad)}, ${esc(sel.prov)} · ${esc(sel.comuna)}</span></div></div>
        <div class="pb" style="display:grid;gap:10px"><dl class="kv"><dt>Canchas</dt><dd>${sel.canchas} × ${esc(model(sel.modelo).nombre)}</dd><dt>Etapa</dt><dd><span class="pill ${pStatus(sel).cls}">${pStatus(sel).txt}</span></dd><dt>Entrega en obra</dt><dd class="mono">${fmtY(sel.etapas.find(e => e.key === 'entrega').fin)}</dd></dl>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary sm" data-act="openproj" data-id="${sel.id}">Abrir proyecto →</button><button class="btn ghost sm" data-act="mapclear">Ver todos</button></div></div></div>` : ''}
      <div class="panel maplist">${inProv.map(p => `<button data-act="mapsel" data-id="${p.id}" aria-current="${UI.calProject === p.id}"><span class="sw" style="background:${colorOf(p)}"></span><span><b>${esc(p.nombre)}</b><br><span class="muted small">${esc(p.ciudad)} · ${esc(p.comuna)}</span></span><span class="mono small">${p.canchas} ${p.canchas === 1 ? 'cancha' : 'canchas'}</span></button>`).join('') || '<div class="empty">Sin proyectos en esta provincia.</div>'}</div>
    </div>
    <div style="display:grid;gap:10px;min-width:0;align-content:start">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <button class="btn" data-act="calprev" aria-label="Mes anterior">←</button><b style="min-width:150px;text-align:center;font-family:var(--f-display);font-size:20px;text-transform:capitalize">${MESES[mo - 1]} ${y}</b><button class="btn" data-act="calnext" aria-label="Mes siguiente">→</button>
        <button class="btn ghost" data-act="caltoday">Hoy</button>
        <span class="muted small">${sel ? `Mostrando solo ${esc(sel.nombre)}` : `${shown.length} proyecto${shown.length === 1 ? '' : 's'}`}</span></div>
      <div class="cal">${['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'].map(d => `<div class="dh">${d}</div>`).join('')}
        ${cells.map(d => { const iso = isoOf(d), evs = events[iso] || [];
          return `<div class="dc ${d.getMonth() !== mo - 1 ? 'out' : ''} ${iso === TODAY ? 'today' : ''}"><span class="n">${d.getDate()}</span>
            ${evs.slice(0, 4).map(ev => `<button class="ev" style="background:${stageColor(ev.e.key)}${ev.e.estado === 'completada' ? ';opacity:.55' : ''}" data-act="openproj" data-id="${ev.p.id}" title="${esc(ev.t)}">${esc(ev.t)}</button>`).join('')}
            ${evs.length > 4 ? `<span class="small muted">+${evs.length - 4} más</span>` : ''}</div>`; }).join('')}
      </div>
    </div>
  </div>`;
}

const projDz = p => ({ ...dzDefault(p.modelo), pasto: (p.diseno && p.diseno.pasto) || '#1f6fd1', postes: (p.diseno && p.diseno.postes) || POSTES_DEF,

    <div class="panel">

      ${list.length ? `<ul class="inbox">${list.map(x => { const st = DEAL_STAGES.find(s => s.key === x.etapa);
        return `<li><button data-act="deal" data-id="${x.id}" aria-current="${x.id === UI.deal}"><span class="t">${esc(x.cliente)}${x.portal && !x.aceptada ? ' <span class="pill st-acc">Nueva desde el portal</span>' : x.portal ? ' <span class="tag">Portal</span>' : ''}</span><span class="pill ${st.cls}">${st.nombre}</span>
        <span class="s">${esc(x.ciudad)} · ${x.canchas} × ${esc(model(x.modelo).nombre)} · <span class="mono">${fmt(x.actualizado)}</span>${(x.cotizaciones || []).length ? ` · ${x.cotizaciones.length} cotización${x.cotizaciones.length > 1 ? 'es' : ''}` : ''}</span></button></li>`; }).join('')}</ul>`

/* ---------- Cotizaciones ---------- */
const money = (n, cur) => { try { return new Intl.NumberFormat('es-AR', { style: 'currency', currency: cur, maximumFractionDigits: 2 }).format(n || 0); } catch (e) { return `${cur} ${(+n || 0).toFixed(2)}`; } };
const qTotal = q => q.items.reduce((s, i) => s + (+i.cant || 0) * (+i.precio || 0), 0);
const qVence = q => addDays(q.fecha, +q.validez || 0);
const QSTATE = { emitida: ['Emitida', 'st-mut'], enviada: ['Enviada', 'st-acc'], aceptada: ['Aceptada por el cliente', 'st-ok'] };
function quotesBlock(d) {
  const qs = d.cotizaciones || [];
  return `<div style="display:grid;gap:10px"><div class="row" style="justify-content:space-between"><h3>Cotizaciones</h3>${d.etapa !== 'perdida' ? `<button class="btn sm primary" data-act="q-new" data-id="${d.id}">${UI.quoteForm === d.id ? 'Cerrar formulario' : '+ Generar cotización'}</button>` : ''}</div>
    ${UI.quoteForm === d.id ? quoteForm(d) : ''}
    ${qs.length ? qs.slice().reverse().map(q => `<div class="qrow"><button class="qhead" data-act="q-open" data-id="${q.id}" aria-expanded="${UI.quoteOpen === q.id}"><b class="mono">${q.numero}</b><span>${fmtY(q.fecha)}</span><span class="mono">${money(qTotal(q), q.moneda)}</span><span class="pill ${QSTATE[q.estado][1]}">${QSTATE[q.estado][0]}</span>${q.portal ? '<span class="tag">En el portal</span>' : ''}</button>
      ${UI.quoteOpen === q.id ? `${quoteDoc(d, q)}${quoteSend(d, q)}` : ''}</div>`).join('') : (UI.quoteForm === d.id ? '' : '<span class="muted small">Aún no hay cotizaciones para este negocio.</span>')}
  </div>`;
}
function quoteForm(d) {
  const m = model(d.modelo);
  const rows = [[`Cancha de pádel ${m.nombre} (${TIPOS[m.tipo]}) · ${d.instal || ''}`, d.canchas, ''], ['Instalación y puesta en marcha', 1, ''], ['Flete a obra', 1, ''], ['', '', '']];
  return `<form class="closebox" data-form="quote" data-id="${d.id}">
    <div class="form">
      <label class="field"><span>Moneda</span><select name="moneda" id="qf-mon"><option>USD</option><option>ARS</option><option>EUR</option></select></label>
      <label class="field"><span>Validez (días)</span><input type="number" min="1" name="validez" id="qf-val" value="15"></label>
    </div>
    <div class="tablewrap"><table class="models qitems"><thead><tr><th>Descripción</th><th>Cant.</th><th>Precio unitario</th></tr></thead><tbody>
      ${rows.map(([desc, cant, precio], i) => `<tr><td><input type="text" name="desc${i}" id="qf-d${i}" value="${esc(desc)}"></td><td><input type="number" min="0" step="1" name="cant${i}" id="qf-c${i}" value="${cant}" style="width:70px"></td><td><input type="number" min="0" step="0.01" name="precio${i}" id="qf-p${i}" value="${precio}" placeholder="0"></td></tr>`).join('')}
    </tbody></table></div>
    <label class="field"><span>Condiciones y notas</span><textarea name="notas" id="qf-notas" rows="2" placeholder="Forma de pago, plazo de entrega, qué incluye…"></textarea></label>
    <span class="muted small">La cotización incluye automáticamente las especificaciones de la cancha (tipo, colores, logo). Las filas sin descripción o sin precio no se incluyen.</span>
    <div><button class="btn primary">Generar cotización</button></div>
  </form>`;
}
function quoteDoc(d, q) {
  const dz = q.dz || dzOf(d), m = model(dz.modelo);
  return `<article class="qdoc">
    <header><div><img class="qlogo" src="${$('.logo-oscuro')?.getAttribute('src') || ''}" alt="ATILA"><div class="small">Canchas de pádel profesionales</div></div>
      <div style="text-align:right"><div class="label">Cotización</div><b class="mono">${q.numero}</b><div class="small">Emitida ${fmtY(q.fecha)} · válida hasta ${fmtY(qVence(q))}</div></div></header>
    <div class="qcli"><div><span class="label">Cliente</span><b>${esc(d.cliente)}</b><br><span class="small">${esc(d.contacto || '')}${d.email ? ' · ' + esc(d.email) : ''}${d.telefono ? ' · ' + esc(d.telefono) : ''}</span></div>
      <div><span class="label">Obra</span><b>${esc(d.ciudad)}, ${esc(d.prov)}</b><br><span class="small">${esc(d.comuna)} · ${d.canchas} cancha${d.canchas > 1 ? 's' : ''} · ${esc(d.instal || '')}</span></div></div>
    <div class="qspec"><span class="label">Especificaciones</span>
      <ul><li>Tipo de cancha: <b>${esc(m.nombre)}</b> (${TIPOS[m.tipo]})</li><li>Césped: ${esc(colorName(dz.pasto))}</li><li>Postes de luz: ${esc(colorName(dz.postes))}</li>
      <li>Amortiguadores: ${esc(dz.amort.ral)} · ${esc(dz.amort.nombre)}</li>${dz.logo ? `<li>Logo: ${[dz.logoAmort && 'en los amortiguadores', dz.logoPuertas && 'sobre las puertas'].filter(Boolean).join(' y ') || 'ubicación a definir'}</li>` : ''}</ul></div>
    <table class="qtable"><thead><tr><th>Descripción</th><th>Cant.</th><th>Precio unitario</th><th>Subtotal</th></tr></thead><tbody>
      ${q.items.map(i => `<tr><td>${esc(i.desc)}</td><td class="mono">${i.cant}</td><td class="mono">${money(i.precio, q.moneda)}</td><td class="mono">${money(i.cant * i.precio, q.moneda)}</td></tr>`).join('')}
    </tbody><tfoot><tr><td colspan="3">Total</td><td class="mono">${money(qTotal(q), q.moneda)}</td></tr></tfoot></table>
    ${q.notas ? `<p class="small"><b>Condiciones:</b> ${esc(q.notas)}</p>` : ''}
    ${q.estado === 'aceptada' ? `<p class="small st-ok"><b>Aceptada por el cliente el ${fmtY(q.aceptadaEl)}.</b></p>` : ''}
  </article>`;
}
function quoteMsg(d, q) {
  return `Hola ${d.contacto || d.cliente}, te enviamos la cotización ${q.numero} de ATILA para ${d.canchas} cancha${d.canchas > 1 ? 's' : ''} ${model(d.modelo).nombre}. Total: ${money(qTotal(q), q.moneda)}. Válida hasta el ${fmtY(qVence(q))}.`
    + (d.clienteId ? ` Puedes verla ingresando al portal de clientes de ATILA con tu correo ${(USERS.find(u => u.id === d.clienteId) || {}).email || ''}.` : '');
}
function quoteSend(d, q) {
  const msg = quoteMsg(d, q), tel = (d.telefono || '').replace(/\D/g, '');
  const mail = `mailto:${encodeURIComponent(d.email || '')}?subject=${encodeURIComponent('Cotización ' + q.numero + ' · ATILA')}&body=${encodeURIComponent(msg)}`;
  return `<div class="qsend"><span class="label">Enviar</span><div class="row">
      <a class="btn sm" href="https://wa.me/${tel}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener" data-act="q-canal" data-canal="WhatsApp" data-deal="${d.id}" data-id="${q.id}">WhatsApp</a>
      <a class="btn sm" href="${mail}" data-act="q-canal" data-canal="Correo" data-deal="${d.id}" data-id="${q.id}">Correo</a>
      <button class="btn sm" data-act="q-copy" data-deal="${d.id}" data-id="${q.id}">Copiar mensaje</button>
      ${d.clienteId ? `<button class="btn sm primary" data-act="q-portal" data-deal="${d.id}" data-id="${q.id}" ${q.portal ? 'disabled' : ''}>${q.portal ? 'Publicada en el portal' : 'Publicar en el portal del cliente'}</button>`
        : `<button class="btn sm ghost" data-act="cli-from-deal" data-id="${d.id}">Crear acceso al portal para publicarla</button>`}</div>
    ${!tel ? '<span class="small muted">Sin teléfono: WhatsApp abrirá para elegir el contacto.</span>' : ''}
    ${(q.canales || []).length ? `<span class="small muted">Enviada por: ${q.canales.map(c => `${esc(c.canal)} (${fmtY(c.f)})`).join(', ')}</span>` : ''}
    <span class="small muted">La cotización es privada: solo la ve el cliente dueño de la cuenta al ingresar con su correo y clave.</span></div>`;
}
function markSent(d, q, canal) {
  q.canales = [...(q.canales || []), { canal, f: TODAY }];
  if (q.estado === 'emitida') q.estado = 'enviada';
  if (d.etapa === 'nuevo') { d.etapa = 'propuesta'; d.hist.push({ f: TODAY, t: 'Etapa cambiada a «Propuesta enviada».' + who() }); }
  d.hist.push({ f: TODAY, t: `Cotización ${q.numero} enviada por ${canal}.` + who() }); d.actualizado = TODAY;
}

/* ---------- Clientes (mantenedor) ---------- */
const CLAVE_WORDS = ['Padel', 'Cancha', 'Saque', 'Volea', 'Globo', 'Smash', 'Bandeja', 'Vibora', 'Red', 'Vidrio'];
const genClave = () => CLAVE_WORDS[Math.floor(Math.random() * CLAVE_WORDS.length)] + '-' + String(1000 + Math.floor(Math.random() * 9000));
function accessMsg(c, clave) {
  return `Hola ${c.nombre}, ya tienes acceso al portal de clientes de ATILA para diseñar tu cancha y ver tus cotizaciones. Ingresa con tu correo ${c.email} y la clave ${clave}. Puedes cambiar la clave desde el portal.`;
}
function vClientes() {
  const list = clientes().filter(c => c.negocios.some(canSee));
  const la = UI.lastAccess && USERS.find(u => u.id === UI.lastAccess.id);
  const pre = UI.cliPrefill || {};
  return `<div class="head"><div><h1>Clientes <em>del portal</em></h1><p>Potenciales clientes con acceso al portal: ingresan con su correo y una clave para diseñar su cancha, enviar solicitudes y ver sus cotizaciones. El sistema propone una clave simple que puedes cambiar.</p></div>
    <button class="btn primary" data-act="cli-new">+ Nuevo cliente</button></div>
  ${la ? `<div class="closebox"><b>Acceso listo para ${esc(la.nombre)}</b>
      <span>Correo: <b class="mono">${esc(la.email)}</b> · Clave: <b class="mono">${esc(UI.lastAccess.clave)}</b></span>
      <span class="small muted">Comparte estos datos ahora: por seguridad la clave no se vuelve a mostrar.</span>
      <div class="row"><a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/${(la.telefono || '').replace(/\D/g, '')}?text=${encodeURIComponent(accessMsg(la, UI.lastAccess.clave))}">Enviar por WhatsApp</a>
        <a class="btn sm" href="mailto:${encodeURIComponent(la.email)}?subject=${encodeURIComponent('Tu acceso al portal de ATILA')}&body=${encodeURIComponent(accessMsg(la, UI.lastAccess.clave))}">Enviar por correo</a>
        <button class="btn sm" data-act="acc-copy">Copiar mensaje</button><button class="btn sm ghost" data-act="acc-close">Listo</button></div></div>` : ''}
  ${UI.cliNew ? `<form class="panel" data-form="cliente"><div class="ph"><h2>Nuevo cliente</h2><button type="button" class="btn ghost sm" data-act="cli-new">Cancelar</button></div>
    <div class="pb form">
      <label class="field"><span>Nombre</span><input type="text" name="nombre" id="cl-nombre" value="${esc(pre.nombre || '')}" required></label>
      <label class="field"><span>Club o empresa</span><input type="text" name="empresa" id="cl-empresa" value="${esc(pre.empresa || '')}"></label>
      <label class="field"><span>Correo (para ingresar)</span><input type="email" name="email" id="cl-email" value="${esc(pre.email || '')}" required></label>
      <label class="field"><span>Teléfono / WhatsApp</span><input type="tel" name="telefono" id="cl-tel" value="${esc(pre.telefono || '')}"></label>
      <label class="field"><span>Ciudad</span><select name="ciudad" id="cl-ciudad">${CITIES.map(c => `<option ${pre.ciudad === c.ciudad ? 'selected' : ''}>${esc(c.ciudad)}</option>`).join('')}</select></label>
      <label class="field"><span>Negocio</span><select name="negocio" id="cl-neg">${allowedNegocios().map(k => `<option value="${k}">${NEGOCIOS[k]}</option>`).join('')}</select></label>
      <label class="field"><span>Clave propuesta (puedes cambiarla)</span><div class="row"><input type="text" name="clave" id="cl-clave" value="${genClave()}" minlength="6" required style="flex:1"><button type="button" class="btn sm" data-act="cli-genclave" data-target="cl-clave">Proponer otra</button></div></label>
      ${UI.formError ? `<p class="st-bad small full" role="alert" style="margin:0">${esc(UI.formError)}</p>` : ''}
      <div class="full"><button class="btn primary">Crear cliente</button></div>
    </div></form>` : ''}
  <div class="panel tablewrap">${list.length ? `<table class="models users"><thead><tr><th>Cliente</th><th>Correo</th><th>Teléfono</th><th>Solicitudes</th><th>Activo</th><th></th></tr></thead><tbody>
    ${list.map(c => `<tr><td><b>${esc(c.nombre)}</b><br><span class="muted small">${esc(c.empresa || '—')} · ${esc(c.ciudad || '')}</span></td><td class="mono small">${esc(c.email)}</td><td class="small">${esc(c.telefono || '—')}</td>
      <td class="mono">${S.deals.filter(d => d.clienteId === c.id).length}</td>
      <td><input type="checkbox" id="ca-${c.id}" data-field="c-activo" data-id="${c.id}" ${c.activo ? 'checked' : ''} aria-label="Activo"></td>
      <td><div class="row" style="justify-content:flex-end"><button class="btn sm" data-act="cli-reset" data-id="${c.id}">Nueva clave</button><button class="btn sm ghost danger" data-act="cli-del" data-id="${c.id}">Eliminar</button></div>
        ${UI.resetCli === c.id ? `<form class="row" data-form="cli-reset" data-id="${c.id}" style="margin-top:8px"><input type="text" name="clave" id="rc-${c.id}" value="${genClave()}" minlength="6" required style="flex:1"><button type="button" class="btn sm" data-act="cli-genclave" data-target="rc-${c.id}">Otra</button><button class="btn sm primary">Guardar</button></form>` : ''}
        ${UI.delCli === c.id ? `<div class="row" style="margin-top:8px"><span class="small">¿Eliminar el acceso de ${esc(c.email)}? Sus negocios quedan en la bandeja.</span><button class="btn sm danger" data-act="cli-delok" data-id="${c.id}">Sí, eliminar</button><button class="btn sm ghost" data-act="cli-del" data-id="">No</button></div>` : ''}</td></tr>`).join('')}
  </tbody></table>` : '<div class="empty">Aún no hay clientes con acceso al portal. Crea el primero con «Nuevo cliente».</div>'}</div>`;
}

/* ---------- Portal de clientes ---------- */
const PORTAL_VIEWS = [
  { id: 'p-disenar', name: 'Diseñar mi cancha', icon: 'M4 18L12 4l8 14zM8 13h8' },
  { id: 'p-solicitudes', name: 'Mis solicitudes', icon: 'M4 6h10M4 12h16M4 18h7' },
  { id: 'p-cotizaciones', name: 'Mis cotizaciones', icon: 'M6 3h9l4 4v14H6zM9 12h7M9 16h7' }
];
const myDeals = () => S.deals.filter(d => d.clienteId === me().id);
const myQuotes = () => myDeals().flatMap(d => (d.cotizaciones || []).filter(q => q.portal).map(q => ({ d, q })));
const CLI_STATE = { nuevo: 'Recibida', propuesta: 'Cotización enviada', negociacion: 'En conversación', cerrada: 'Venta cerrada', perdida: 'No concretada' };
function vPortal() {
  const v = UI.view;
  if (v === 'p-solicitudes') {
    const list = myDeals().sort((a, b) => b.actualizado.localeCompare(a.actualizado));
    if (!list.find(d => d.id === UI.pSel)) UI.pSel = list[0]?.id;
    const d = list.find(x => x.id === UI.pSel);
    return `<div class="head"><div><h1>Mis <em>solicitudes</em></h1><p>Las canchas que diseñaste y su estado con el equipo ATILA.</p></div><button class="btn primary" data-act="view" data-id="p-disenar">+ Nueva solicitud</button></div>
    ${list.length ? `<div class="split"><div class="panel"><ul class="inbox">${list.map(x => `<li><button data-act="p-sel" data-id="${x.id}" aria-current="${x.id === UI.pSel}"><span class="t">${x.canchas} × ${esc(model(x.modelo).nombre)}</span><span class="pill st-acc">${CLI_STATE[x.etapa]}</span><span class="s">${esc(x.ciudad)} · enviada ${fmtY(x.creado || x.actualizado)}</span></button></li>`).join('')}</ul></div>
      <div class="panel">${d ? `<div class="ph"><h2>${d.canchas} × ${esc(model(d.modelo).nombre)}</h2><span class="pill st-acc">${CLI_STATE[d.etapa]}</span></div>
        <div class="pb" style="display:grid;gap:14px">${viewer3d(dzOf(d), { small: true })}${specList(dzOf(d), d)}
        ${d.proyectoId && project(d.proyectoId) ? `<div class="closebox"><b>Tu proyecto: ${esc(pStatus(project(d.proyectoId)).txt)}</b><span class="small">Entrega en obra estimada: ${fmtY(project(d.proyectoId).etapas.find(e => e.key === 'entrega').fin)}</span></div>` : ''}
        ${(d.cotizaciones || []).some(q => q.portal) ? '<div><button class="btn sm" data-act="view" data-id="p-cotizaciones">Ver cotizaciones</button></div>' : '<span class="muted small">Cuando ATILA te envíe una cotización, la verás en «Mis cotizaciones».</span>'}</div>` : ''}</div></div>`
      : `<div class="panel"><div class="empty">Aún no enviaste solicitudes.<button class="btn primary" data-act="view" data-id="p-disenar">Diseñar mi cancha</button></div></div>`}`;
  }
  if (v === 'p-cotizaciones') {
    const qs = myQuotes().sort((a, b) => b.q.fecha.localeCompare(a.q.fecha));
    return `<div class="head"><div><h1>Mis <em>cotizaciones</em></h1><p>Cotizaciones que ATILA preparó para ti. Solo tú las ves con tu correo y clave.</p></div></div>
    ${qs.length ? qs.map(({ d, q }) => `<div class="panel"><div class="pb" style="display:grid;gap:12px">${quoteDoc(d, q)}
      ${q.estado !== 'aceptada' ? `<div class="row"><button class="btn primary" data-act="q-accept" data-deal="${d.id}" data-id="${q.id}">Aceptar cotización</button><span class="small muted">Al aceptarla, el equipo ATILA te contactará para cerrar la compra.</span></div>` : ''}</div></div>`).join('')
      : '<div class="panel"><div class="empty">Todavía no tienes cotizaciones. Llegarán aquí cuando ATILA responda tu solicitud.</div></div>'}`;
  }
  // diseñar
  if (!UI.dz) { UI.dz = dzDefault(S.models[0].id); UI.dzPart = 'pasto'; }
  return `<div class="head"><div><h1>Diseña tu <em>cancha</em></h1><p>Elige el tipo de cancha y sus colores, gírala para verla desde todos los ángulos y envíanos tu solicitud. El equipo ATILA te responderá con una cotización.</p></div></div>
  <form class="panel" data-form="solicitud"><div class="pb" style="display:grid;gap:18px">
    ${designer()}
    <h3>Tus datos y la obra</h3>${dealFields(null, true)}
    <div><button class="btn primary">Enviar solicitud</button></div>
  </div></form>`;
}

  return `<div class="head"><div><h1>Tipos de <em>cancha</em></h1><p>Los dos tipos de cancha ATILA. Puedes editar el nombre y la descripción de cada uno.</p></div></div>
  <div class="panel tablewrap"><table class="models"><thead><tr><th>Nombre</th><th>Estructura</th><th>Descripción</th><th>Proyectos</th></tr></thead><tbody>
  ${S.models.map(m => `<tr><td><input type="text" id="mn-${m.id}" value="${esc(m.nombre)}" data-field="m-nombre" data-id="${m.id}" aria-label="Nombre del tipo de cancha"></td>
    <td><span class="typebadge">${TIPOS[m.tipo]}</span></td>
    <td><input type="text" id="md-${m.id}" value="${esc(m.desc || '')}" data-field="m-desc" data-id="${m.id}" aria-label="Descripción"></td>
    <td class="mono">${S.projects.filter(p => p.modelo === m.id).length}</td></tr>`).join('')}
