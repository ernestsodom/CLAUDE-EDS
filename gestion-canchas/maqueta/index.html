/* ===================== Acciones ===================== */
function logP(p, t, f = TODAY) { p.traza.push({ f, t: t + who() }); }
function commit(msg) { save(); render(); if (msg) toast(msg); }
const findQ = (dealId, qid) => { const d = S.deals.find(x => x.id === dealId); return [d, d && (d.cotizaciones || []).find(q => q.id === qid)]; };
async function copyText(t) { try { await navigator.clipboard.writeText(t); toast('Mensaje copiado'); } catch (e) { toast('No se pudo copiar automáticamente. Selecciona el texto y cópialo.'); } }

document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const id = b.dataset.id, act = b.dataset.act;
  const deal = () => S.deals.find(d => d.id === id);
  switch (act) {
    case 'profile': if (!canSee(id)) break; UI.profile = id; if (['usuarios', 'clave', 'inicio', 'clientes'].includes(UI.view)) UI.view = id === 'atila' ? 'bandeja' : 'inicio'; saveUI(); render(); break;
    case 'logout': setSession(null); UI.loginError = ''; UI.dz = null; UI.view = 'bandeja'; render(); break;
    case 'newuser': UI.newUser = !UI.newUser; UI.formError = ''; render(); break;
    case 'ureset': UI.resetUser = UI.resetUser === id ? null : id; UI.delUser = null; render(); break;
    case 'udel': UI.delUser = id || null; UI.resetUser = null; render(); break;
    case 'udelok': { const u = USERS.find(x => x.id === id);
      if (u.rol === 'superadmin' && activeSupers().length <= 1) { toast('Debe quedar al menos un super administrador activo.'); break; }
      USERS = USERS.filter(x => x.id !== id); UI.delUser = null; saveUsers(); render(); toast(`Usuario ${u.usuario} eliminado`); break; }
    case 'view': UI.view = id; UI.formError = ''; UI.projOpen = false; UI.newDeal = false; UI.editDeal = null;
      if (id === 'p-disenar') { UI.dz = dzDefault(S.models[0].id); UI.dzPart = 'pasto'; }
      saveUI(); render(); window.scrollTo(0, 0); break;
    case 'theme': document.documentElement.dataset.theme = id; try { localStorage.setItem(KEY + '-theme', id); } catch (e) {} renderNav(); break;
    case 'reset': S = seed(); UI.deal = null; UI.project = 'p1'; commit('Datos del Excel cargados de nuevo'); break;
    // bandeja
    case 'dfilter': UI.dealFilter = id; UI.deal = null; UI.closing = false; render(); break;
    case 'deal': UI.deal = id; UI.closing = false; UI.quoteForm = null; UI.quoteOpen = null; render(); break;
    case 'newdeal': UI.newDeal = true; UI.editDeal = null; UI.dz = dzDefault(S.models[0].id); UI.dzPart = 'pasto'; render(); window.scrollTo(0, 0); break;
    case 'd-edit': UI.editDeal = id; UI.newDeal = false; UI.dz = dzOf(deal()); UI.dzPart = 'pasto'; render(); window.scrollTo(0, 0); break;
    case 'dealcancel': UI.newDeal = false; UI.editDeal = null; render(); break;
    case 'd-aceptar': { const d = deal(); d.aceptada = true; d.actualizado = TODAY; d.hist.push({ f: TODAY, t: 'Solicitud del portal aceptada.' + who() }); commit('Solicitud aceptada'); break; }
    case 'lose': { const d = deal(); d.etapa = 'perdida'; d.actualizado = TODAY; d.hist.push({ f: TODAY, t: 'Negocio marcado como perdido.' + who() }); commit('Negocio marcado como perdido'); break; }
    case 'closeopen': UI.closing = true; render(); break;
    case 'closecancel': UI.closing = false; render(); break;
    case 'cli-from-deal': { const d = deal(); UI.view = 'clientes'; UI.cliNew = true; UI.linkDeal = d.id;
      UI.cliPrefill = { nombre: d.contacto, empresa: d.cliente, email: d.email, telefono: d.telefono, ciudad: d.ciudad }; render(); window.scrollTo(0, 0); break; }
    // cotizaciones
    case 'q-new': UI.quoteForm = UI.quoteForm === id ? null : id; render(); break;
    case 'q-open': UI.quoteOpen = UI.quoteOpen === id ? null : id; render(); break;
    case 'q-canal': { const [d, q] = findQ(b.dataset.deal, id); markSent(d, q, b.dataset.canal); save(); setTimeout(render, 50); break; }
    case 'q-copy': { const [d, q] = findQ(b.dataset.deal, id); copyText(quoteMsg(d, q)); break; }
    case 'q-portal': { const [d, q] = findQ(b.dataset.deal, id); q.portal = true; markSent(d, q, 'Portal de clientes'); commit('Cotización publicada en el portal del cliente'); break; }
    case 'q-accept': { const [d, q] = findQ(b.dataset.deal, id); q.estado = 'aceptada'; q.aceptadaEl = TODAY;
      if (d.etapa === 'propuesta' || d.etapa === 'nuevo') d.etapa = 'negociacion';
      d.actualizado = TODAY; d.hist.push({ f: TODAY, t: `El cliente aceptó la cotización ${q.numero} desde el portal.` }); commit('Cotización aceptada. ATILA te contactará.'); break; }
    // clientes
    case 'cli-new': UI.cliNew = !UI.cliNew; UI.formError = ''; if (!UI.cliNew) { UI.cliPrefill = null; UI.linkDeal = null; } render(); break;
    case 'cli-genclave': { const inp = document.getElementById(b.dataset.target); if (inp) inp.value = genClave(); break; }
    case 'cli-reset': UI.resetCli = UI.resetCli === id ? null : id; UI.delCli = null; render(); break;
    case 'cli-del': UI.delCli = id || null; UI.resetCli = null; render(); break;
    case 'cli-delok': { const c = USERS.find(x => x.id === id); USERS = USERS.filter(x => x.id !== id); S.deals.forEach(d => { if (d.clienteId === id) d.clienteId = null; });
      UI.delCli = null; saveUsers(); commit(`Acceso de ${c.email} eliminado`); break; }
    case 'acc-copy': { const c = USERS.find(u => u.id === UI.lastAccess.id); copyText(accessMsg(c, UI.lastAccess.clave)); break; }
    case 'acc-close': UI.lastAccess = null; render(); break;
    // diseñador
    case 'dz-modelo': { const prev = UI.dz.modelo; if (UI.dz.pasto === pastoIni(prev)) UI.dz.pasto = pastoIni(id); UI.dz.modelo = id; dzRefresh(['tipos', 'pal', 'view']); break; }
    case 'dz-part': UI.dzPart = id; dzRefresh(['pal']); break;
    case 'dz-color': setPart(UI.dzPart, b.dataset.hex, b.dataset.ral); dzRefresh(['pal', 'view']); break;
    case 'dz-filedel': UI.dz[id] = null; if (id === 'logo') { UI.dz.logoAmort = UI.dz.logoPuertas = false; } dzRefresh(['files', 'view']); break;
    // portal
    case 'p-sel': UI.pSel = id; render(); break;
    // proyectos
    case 'openproj': UI.profile = 'atila'; UI.view = 'proyectos'; UI.project = id; UI.projOpen = true; saveUI(); render(); window.scrollTo(0, 0); break;
    case 'projback': UI.projOpen = false; render(); window.scrollTo(0, 0); break;
    case 'stage-start': case 'stage-done': case 'stage-undo': {
      const p = project(id), e = p.etapas[+b.dataset.i];
      if (act === 'stage-start') { e.estado = 'en_curso'; logP(p, `Etapa iniciada: ${stageName(e.key)}.`); }
      if (act === 'stage-done') { e.estado = 'completada'; e.hecho = TODAY; logP(p, `Etapa completada: ${stageName(e.key)}.`);
        const nx = p.etapas[+b.dataset.i + 1]; if (nx && nx.inicio <= TODAY) { nx.estado = 'en_curso'; logP(p, `Etapa iniciada: ${stageName(nx.key)}.`); } }
      if (act === 'stage-undo') { e.estado = 'en_curso'; e.hecho = ''; p.etapas.slice(+b.dataset.i + 1).forEach(n => n.estado = 'pendiente'); logP(p, `Etapa reabierta: ${stageName(e.key)}.`); }
      commit(act === 'stage-done' ? `${stageName(e.key)}: completada` : null); break; }
    case 'calprev': case 'calnext': { const [y, m] = UI.cal.split('-').map(Number); const d = new Date(y, m - 1 + (act === 'calnext' ? 1 : -1), 1); UI.cal = isoOf(d).slice(0, 7); render(); break; }
    case 'caltoday': UI.cal = TODAY.slice(0, 7); render(); break;
    case 'mapsel': UI.calProject = UI.calProject === id ? '' : id; if (UI.calProject) mapFocus(project(id)); render(); break;
    case 'mapzoom': if (id === 'all') UI.map = { z: 1, cx: MAPW / 2, cy: MAPH / 2 }; else UI.map.z *= id === 'in' ? 2 : 0.5; applyMap(); break;
    case 'mapclear': UI.calProject = ''; render(); break;
  }
});

document.addEventListener('change', ev => {
  const t = ev.target, f = t.dataset.field; if (!f) return;
  if (f === 'inicio' || f === 'fin') {
    const p = project(t.dataset.id), e = p.etapas[+t.dataset.i]; if (!t.value) return;
    const old = e[f]; e[f] = t.value; if (e.fin < e.inicio) e[f === 'inicio' ? 'fin' : 'inicio'] = t.value;
    logP(p, `Reprogramada ${stageName(e.key).toLowerCase()}: ${f} ${fmtY(old)} → ${fmtY(t.value)}.`); commit('Fecha actualizada'); return;
  }
  if (f.startsWith('u-')) {
    const u = USERS.find(x => x.id === t.dataset.id);
    if (f === 'u-neg') u.negocios = t.checked ? [...new Set([...u.negocios, t.dataset.neg])] : u.negocios.filter(n => n !== t.dataset.neg);
    if (f === 'u-rol') { if (u.rol === 'superadmin' && t.value !== 'superadmin' && activeSupers().length <= 1) { toast('Debe quedar al menos un super administrador activo.'); render(); return; } u.rol = t.value; }
    if (f === 'u-activo') { if (!t.checked && u.rol === 'superadmin' && activeSupers().length <= 1) { toast('Debe quedar al menos un super administrador activo.'); render(); return; } u.activo = t.checked; }
    saveUsers(); render(); toast('Permisos actualizados'); return;
  }
  if (f === 'c-activo') { const c = USERS.find(x => x.id === t.dataset.id); c.activo = t.checked; saveUsers(); render(); toast(c.activo ? 'Acceso activado' : 'Acceso desactivado'); return; }
  if (f === 'd-etapa') { const d = S.deals.find(x => x.id === t.dataset.id), s = DEAL_STAGES.find(x => x.key === t.value);
    d.etapa = t.value; d.aceptada = true; d.actualizado = TODAY; d.hist.push({ f: TODAY, t: `Etapa cambiada a «${s.nombre}».` + who() }); commit('Etapa actualizada'); return; }
  if (f === 'dz-ral') { if (!t.value) return; const r = RAL.find(x => x.ral === t.value); setPart(UI.dzPart, r.hex, r.ral); dzRefresh(['pal', 'view']); return; }
  if (f === 'dz-libre') { dzRefresh(['pal']); return; }
  if (f === 'dz-instal') { if (UI.dz) { UI.dz.instal = t.value; dzRefresh(['view']); } return; }
  if (f === 'dz-logoAmort' || f === 'dz-logoPuertas') { UI.dz[f.slice(3)] = t.checked; dzRefresh(['view']); return; }
  if (f === 'dz-file') { const file = t.files[0], kind = t.dataset.kind; if (!file) return;
    if (file.size > 2 * 1024 * 1024) { toast(`«${file.name}» pesa más de 2 MB. Usa un archivo más liviano.`); t.value = ''; return; }
    const r = new FileReader(); r.onload = () => { UI.dz[kind] = { name: file.name, type: file.type || 'application/octet-stream', size: file.size, data: r.result };
      if (kind === 'logo' && !UI.dz.logoAmort && !UI.dz.logoPuertas) UI.dz.logoAmort = true; dzRefresh(['files', 'view']); }; r.readAsDataURL(file); return; }
  if (f === 'calProject') { UI.calProject = t.value; render(); return; }
  if (f === 'mapProv') { UI.mapProv = t.value; UI.calProject = ''; render(); return; }
  if (f.startsWith('m-')) { const m = S.models.find(x => x.id === t.dataset.id); m[f.slice(2)] = t.value; commit('Tipo de cancha actualizado'); }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.field === 'dz-libre') { setPart(UI.dzPart, t.value); dzRefresh(['view', 'name']); }
});

document.addEventListener('submit', async ev => {
  const f = ev.target, kind = f.dataset.form; if (!kind) return;
  ev.preventDefault();
  const fd = Object.fromEntries(new FormData(f));
  if (kind === 'login') {
    const key = fd.usuario.trim().toLowerCase(), u = USERS.find(x => x.usuario.toLowerCase() === key || (x.email || '').toLowerCase() === key);
    if (!u || u.hash !== await hashPw(u.usuario, fd.clave)) { UI.loginError = 'Usuario, correo o contraseña incorrectos.'; render(); return; }
    if (!u.activo) { UI.loginError = 'Este acceso está desactivado. Comunícate con ATILA para reactivarlo.'; render(); return; }
    UI.loginError = ''; setSession(u.id); UI.view = u.rol === 'cliente' ? 'p-disenar' : 'bandeja'; UI.dz = null; render(); toast(`Hola, ${u.nombre}`); return;
  }
  if (kind === 'pwchange') {
    const u = me();
    if (u.hash !== await hashPw(u.usuario, fd.actual)) { UI.formError = 'La contraseña actual no es correcta.'; render(); return; }
    if (fd.nueva !== fd.repetir) { UI.formError = 'Las contraseñas nuevas no coinciden.'; render(); return; }
    u.hash = await hashPw(u.usuario, fd.nueva); saveUsers(); UI.formError = ''; UI.view = u.rol === 'cliente' ? 'p-solicitudes' : UI.profile === 'atila' ? 'bandeja' : 'inicio'; render(); toast('Contraseña actualizada'); return;
  }
  if (kind === 'newuser') {
    const usuario = fd.usuario.trim();
    if (USERS.some(x => x.usuario.toLowerCase() === usuario.toLowerCase())) { UI.formError = `El usuario «${usuario}» ya existe. Elige otro.`; render(); return; }
    const negocios = Object.keys(NEGOCIOS).filter(k => fd['neg_' + k]);
    USERS.push({ id: uid('u'), usuario, nombre: fd.nombre.trim(), rol: fd.rol, negocios, activo: true, hash: await hashPw(usuario, fd.clave) });
    saveUsers(); UI.newUser = false; UI.formError = ''; render(); toast(`Usuario ${usuario} creado`); return;
  }
  if (kind === 'pwreset') {
    const u = USERS.find(x => x.id === f.dataset.id); u.hash = await hashPw(u.usuario, fd.clave);
    saveUsers(); UI.resetUser = null; render(); toast(`Contraseña de ${u.usuario} actualizada`); return;
  }
  if (kind === 'cliente') {
    const email = fd.email.trim().toLowerCase();
    if (USERS.some(x => x.usuario.toLowerCase() === email || (x.email || '').toLowerCase() === email)) { UI.formError = `Ya existe un acceso con el correo ${email}.`; render(); return; }
    const c = { id: uid('c'), usuario: email, email, nombre: fd.nombre.trim(), empresa: fd.empresa.trim(), telefono: fd.telefono.trim(), ciudad: fd.ciudad,
      rol: 'cliente', negocios: [fd.negocio], activo: true, creado: TODAY, hash: await hashPw(email, fd.clave) };
    USERS.push(c); saveUsers();
    if (UI.linkDeal) { const d = S.deals.find(x => x.id === UI.linkDeal); if (d) { d.clienteId = c.id; d.hist.push({ f: TODAY, t: `Acceso al portal creado para ${email}.` + who() }); save(); } }
    UI.lastAccess = { id: c.id, clave: fd.clave }; UI.cliNew = false; UI.cliPrefill = null; UI.formError = '';
    if (UI.linkDeal) { UI.view = 'clientes'; UI.linkDeal = null; }
    render(); toast(`Cliente ${c.nombre} creado`); return;
  }
  if (kind === 'cli-reset') {
    const c = USERS.find(x => x.id === f.dataset.id); c.hash = await hashPw(c.usuario, fd.clave); saveUsers();
    UI.resetCli = null; UI.lastAccess = { id: c.id, clave: fd.clave }; render(); window.scrollTo(0, 0); toast(`Nueva clave para ${c.email}`); return;
  }
  if (kind === 'note') { const d = S.deals.find(x => x.id === f.dataset.id); d.hist.push({ f: TODAY, t: fd.t + who() }); d.actualizado = TODAY; commit('Nota agregada'); }
  if (kind === 'pnote') { logP(project(f.dataset.id), fd.t); commit('Novedad registrada'); }
  if (kind === 'deal') {
    if (f.dataset.id) { const d = S.deals.find(x => x.id === f.dataset.id); readDeal(fd, d); d.origen = fd.origen; d.clienteId = fd.clienteId || null; d.actualizado = TODAY;
      d.hist.push({ f: TODAY, t: 'Datos y diseño de la cancha modificados.' + who() }); UI.editDeal = null; commit(save() ? 'Negocio actualizado' : null); return; }
    const d = readDeal(fd, { id: uid('d'), origen: fd.origen, clienteId: fd.clienteId || null, etapa: 'nuevo', aceptada: true, creado: TODAY, actualizado: TODAY, proyectoId: null, cotizaciones: [],
      hist: [{ f: TODAY, t: 'Negocio ingresado a la bandeja.' + who() }] });
    S.deals.push(d); UI.newDeal = false; UI.deal = d.id; UI.dealFilter = 'activos'; commit('Negocio agregado a la bandeja'); return;
  }
  if (kind === 'solicitud') {
    const u = me(), d = readDeal(fd, { id: uid('d'), origen: 'Portal cliente', portal: true, aceptada: false, clienteId: u.id, etapa: 'nuevo', creado: TODAY, actualizado: TODAY, proyectoId: null, cotizaciones: [],
      hist: [{ f: TODAY, t: `Solicitud recibida desde el portal de clientes (${u.email}).` }] });
    d.email = u.email; S.deals.push(d);
    if (!save()) return;
    UI.dz = null; UI.view = 'p-solicitudes'; UI.pSel = d.id; render(); window.scrollTo(0, 0); toast('Solicitud enviada. ATILA te responderá con una cotización.'); return;
  }
  if (kind === 'quote') {
    const d = S.deals.find(x => x.id === f.dataset.id);
    const items = [0, 1, 2, 3].map(i => ({ desc: (fd['desc' + i] || '').trim(), cant: +fd['cant' + i] || 0, precio: +fd['precio' + i] || 0 })).filter(i => i.desc && i.cant && i.precio);
    if (!items.length) { toast('Agrega al menos una fila con descripción, cantidad y precio.'); return; }
    S.quoteSeq = (S.quoteSeq || 0) + 1;
    const q = { id: uid('q'), numero: `COT-${TODAY.slice(0, 4)}-${String(S.quoteSeq).padStart(4, '0')}`, fecha: TODAY, moneda: fd.moneda, validez: +fd.validez || 15, items, notas: fd.notas.trim(),
      estado: 'emitida', portal: false, canales: [], dz: dzOf(d) };
    d.cotizaciones = [...(d.cotizaciones || []), q]; d.actualizado = TODAY; d.hist.push({ f: TODAY, t: `Cotización ${q.numero} generada por ${money(qTotal(q), q.moneda)}.` + who() });
    UI.quoteForm = null; UI.quoteOpen = q.id; commit(`Cotización ${q.numero} generada`); return;
  }
  if (kind === 'close') { const d = S.deals.find(x => x.id === f.dataset.id), c = cityOf(d.ciudad), dz = dzOf(d);
    const p = { id: uid('p'), dealId: d.id, clienteId: d.clienteId || null, nombre: fd.nombre, cliente: d.cliente, prov: c.prov, ciudad: c.ciudad, comuna: d.comuna, lat: c.lat, lon: c.lon,
      modelo: d.modelo, canchas: d.canchas, instal: d.instal, cesped: colorName(dz.pasto), diseno: { pasto: dz.pasto, postes: dz.postes, amort: dz.amort },
      archivos: { logo: dz.logo, logoAmort: dz.logoAmort, logoPuertas: dz.logoPuertas, mapa: dz.mapa }, obs: d.comentario || '', etapas: schedule(fd.fecha), traza: [] };
    p.etapas[0].estado = 'completada'; p.etapas[0].hecho = fd.fecha;
    d.hist.forEach(h => p.traza.push({ f: h.f, t: `[Bandeja] ${h.t}` }));
    p.traza.push({ f: fd.fecha, t: 'Venta cerrada. Proyecto creado desde la bandeja de negocios.' + who() });
    d.etapa = 'cerrada'; d.actualizado = TODAY; d.proyectoId = p.id; d.hist.push({ f: TODAY, t: `Venta cerrada; pasa a Proyectos como «${fd.nombre}».` + who() });
    S.projects.unshift(p); UI.closing = false; UI.view = 'proyectos'; UI.project = p.id; UI.projOpen = true; saveUI(); commit('Venta cerrada. Proyecto creado con su línea de tiempo'); window.scrollTo(0, 0); }
});

initUsers().then(render);
</script>
